22.5" font-size="12.5" fill="#1E293B" text-anchor="middle">收件檢查</text><rect x="458" y="354" width="191" height="42" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="553.5" y="369" font-size="12.5" fill="#1E293B" text-anchor="middle">需求、合約、介面、測試寫錯、</text><text x="553.5" y="386" font-size="12.5" fill="#1E293B" text-anchor="middle">環境問題、驗證缺口</text><rect x="889.3" y="98.5" width="71" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="924.8" y="113.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">超過 3 輪</text><rect x="890.15" y="207.5" width="71" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="925.65" y="222.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">超過 3 輪</text>
