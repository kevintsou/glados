<svg xmlns="http://www.w3.org/2000/svg" width="1261" height="499" viewBox="0 0 1261 499" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei','Noto Sans CJK TC',system-ui,-apple-system,'Segoe UI',sans-serif" role="img" aria-label="失敗的去處">
