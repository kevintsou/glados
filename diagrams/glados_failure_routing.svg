th="1.3" filter="url(#sh)"/><text x="471" y="459" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">R 失敗分類</text><text x="471" y="479" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">依規則判斷類型</text><text x="471" y="498" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">判不出來時派一次獨立分析參考</text><rect x="859" y="68" width="183" height="66" rx="22" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" filter="url(#sh)"/><text x="950.5" y="97" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">回 M4 實作與 build</text><text x="950.5" y="117" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">計入輪數</text><rect x="859" y="168" width="156" height="47" rx="22" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" filter="url(#sh)"/><text x="937" y="197" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">回 M3 實作計畫</text><rect x="859" y="249" width="156" height="66" rx="22" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" filter="url(#sh)"/><text x="937" y="278" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">回 M2 驗收定義</text><text x="937" y="298" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">在合約內修正</text><rect x="859" y="349" width="178" height="66" rx="10" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3" filter="url(#sh)"/><text x="948" y="378" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">回 M2，經 H2 核准</text><text x="948" y="398" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">需求也變就先回 M1</text><rect x="859" y="449" width="178" height="47" rx="10" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3" filter="url(#sh)"/><text x="948" y="478" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">回 M1，經 H1 核准</text><rect x="859" y="530" width="175" height="47" rx="10" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3" filter="url(#sh)"/><text x="946.5" y="559" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">回 P3，經 G2 核准</text><rect x="859" y="611" width="217" height="47" rx="22" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" filter="url(#sh)"/><text x="967.5" y="640" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">從最早過期的那一站重走</text><rect x="859" y="692" width="201" height="85" rx="22" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" filter="url(#sh)"/><text x="959.5" y="721" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">回產出該輸入的那一站</text><text x="959.5" y="741" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">外部資訊：等待外部回覆</text><text x="959.5" y="760" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">依那一站的關卡</text><rect x="859" y="811" width="128" height="47" rx="10" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3" filter="url(#sh)"/><text x="923" y="840" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">交給人</text><rect x="684.45" y="88.5" width="62" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="715.45" y="103.5" font-size="12.5" fill="#1E293B" text-anchor="middle">code 錯</text><rect x="681.45" y="179.5" width="79" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="720.95" y="194.5" font-size="12.5" fill="#1E293B" text-anchor="middle">計畫不夠用</text><rect x="674.9" y="269.5" width="79" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="714.4" y="284.5" font-size="12.5" fill="#1E293B" text-anchor="middle">測試實作錯</text><rect x="674.9" y="369.5" width="91" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="720.4" y="384.5" font-size="12.5" fill="#1E293B" text-anchor="middle">驗收標準要改</text><rect x="662.5" y="460.5" width="112" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="718.5" y="475.5" font-size="12.5" fill="#1E293B" text-anchor="middle">spec 缺口或矛盾</text><rect x="687.4" y="541.5" width="66" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="720.4" y="556.5" font-size="12.5" fill="#1E293B" text-anchor="middle">介面衝突</text><rect x="649.9" y="622.5" width="129" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="714.4" y="637.5" font-size="12.5" fill="#1E293B" text-anchor="middle">交接紀錄過期或不齊</text><rect x="687.95" y="722.5" width="66" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="720.95" y="737.5" font-size="12.5" fill="#1E293B" text-anchor="middle">輸入不足</text><rect x="644.95" y="814" width="141" height="42" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="715.45" y="829" font-size="12.5" fill="#1E293B" text-anchor="middle">環境問題、驗證缺口、</text><text x="715.45" y="846" font-size="12.5" fill="#1E293B" text-anchor="middle">連續 3 輪同樣失敗</text>
<rect x="28" y="921" width="26" height="16" rx="8" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3"/><text x="60" y="933.5" font-size="12.5" fill="#475569">圖外的節點或起點</text><rect x="182" y="921" width="26" height="16" rx="4" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3"/><text x="214" y="933.5" font-size="12.5" fill="#475569">串接層的判斷</text><rect x="311" y="921" width="26" height="16" rx="4" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3"/><text x="343" y="933.5" font-size="12.5" fill="#475569">需要人</text><path d="M402.5,929 H432.5" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><text x="440.5" y="933.5" font-size="12.5" fill="#475569">正常往下走</text>
