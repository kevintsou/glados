r="middle" opacity="0.92">最多 3 輪</text><rect x="706" y="168" width="134" height="66" rx="22" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" filter="url(#sh)"/><text x="773" y="197" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">回 M4 重做</text><text x="773" y="217" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">計入 M4 的輪數</text><rect x="706" y="268" width="133" height="66" rx="10" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3" filter="url(#sh)"/><text x="772.5" y="297" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">交還給人補齊</text><text x="772.5" y="317" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">不計輪數</text><rect x="987" y="278" width="192" height="104" rx="10" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3" filter="url(#sh)"/><text x="1083" y="307" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">交給人</text><text x="1083" y="327" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">自己做、指定回哪一站、</text><text x="1083" y="346" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">修好環境重跑、再試一次，</text><text x="1083" y="365" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">或這版不做</text><rect x="451.54999999999995" y="116" width="174" height="42" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="538.55" y="131" font-size="12.5" fill="#1E293B" text-anchor="middle">派工節點自己的檢查</text><text x="538.55" y="148" font-size="12.5" fill="#1E293B" text-anchor="middle">（build、warning、預算…）</text><rect x="483" y="180" width="115" height="42" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="540.5" y="195" font-size="12.5" fill="#1E293B" text-anchor="middle">M5 case FAIL、</text><text x="540.5" y="212" font-size="12.5" fill="#1E293B" text-anchor="middle">M6 阻擋項目</text><rect x="491.04999999999995" y="271" width="104" height="42" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="543.05" y="286" font-size="12.5" fill="#1E293B" text-anchor="middle">外部互動節點的</text><text x="543.05" y="303" font-size="12.5" fill="#1E293B" text-anchor="middle">收件或擋關檢查</text><rect x="447.5" y="335" width="191" height="42" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="543" y="350" font-size="12.5" fill="#1E293B" text-anchor="middle">需求、合約、介面、測試寫錯、</text><text x="543" y="367" font-size="12.5" fill="#1E293B" text-anchor="middle">環境問題、驗證缺口</text><rect x="847.3" y="88.5" width="71" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="882.8" y="103.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">超過 3 輪</text><rect x="848.15" y="188.5" width="71" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="883.65" y="203.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">超過 3 輪</text>
<rect x="28" y="442" width="26" height="16" rx="8" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3"/><text x="60" y="454.5" font-size="12.5" fill="#475569">圖外的節點或起點</text><rect x="182" y="442" width="26" height="16" rx="8" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3"/><text x="214" y="454.5" font-size="12.5" fill="#475569">串接層的判斷</text><rect x="311" y="442" width="26" height="16" rx="4" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3"/><text x="343" y="454.5" font-size="12.5" fill="#475569">需要人</text><path d="M402.5,450 H432.5" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><text x="440.5" y="454.5" font-size="12.5" fill="#475569">正常往下走</text><path d="M525,450 H555" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><text x="563" y="454.5" font-size="12.5" fill="#475569">失敗或退回</text>
