<text x="28" y="36" font-size="19" font-weight="700" fill="#0F172A">失敗的去處</text><text x="143.65" y="36" font-size="13" fill="#64748B">派工節點自己的問題在節點內重做；其他一律交給人決定回哪裡</text>
<line x1="28" y1="426" x2="1191" y2="426" stroke="#E2E8F0"/>
