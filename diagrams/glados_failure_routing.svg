<svg xmlns="http://www.w3.org/2000/svg" width="1116" height="959" viewBox="0 0 1116 959" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei','Noto Sans CJK TC',system-ui,-apple-system,'Segoe UI',sans-serif" role="img" aria-label="R 失敗分類的去處">
