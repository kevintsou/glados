="341" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">確認起點能 build、能跑，留下對照基準</text><rect x="84" y="435" width="262" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="163.8108" y="450" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="178.9" y="464" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P2</text><text x="201.9892" y="464" font-size="15" font-weight="700" fill="#0F172A">差異分析</text><text x="215" y="484" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">範圍清單 → code → 切成模組</text><path d="M111,547 H230 L246,570.5 L230,594 H111 L95,570.5 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="170.5" y="576" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">G1 範圍核准</text><rect x="84" y="671" width="262" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="155.7858" y="686" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="170.875" y="700" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P3</text><text x="193.9642" y="700" font-size="15" font-weight="700" fill="#0F172A">架構與介面</text><text x="215" y="720" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">介面合約、記憶體預算</text><path d="M111,783 H230 L246,806.5 L230,830 H111 L95,806.5 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="170.5" y="812" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">G2 架構審查</text><rect x="84" y="907" width="262" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="115.5324" y="922" width="62.5352" height="19" rx="9.5" fill="#3B5BAA"/><text x="146.8" y="936" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M1–M7</text><text x="186.0676" y="936" font-size="15" font-weight="700" fill="#0F172A">每個模組各跑一次</text><text x="215" y="956" font-size