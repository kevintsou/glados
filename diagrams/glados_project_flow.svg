134.9" y="321" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P1</text><text x="157.9892" y="321" font-size="15" font-weight="700" fill="#0F172A">基線建立</text><text x="171" y="341" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">確認起點能 build、能跑，留下對照基準</text><rect x="61" y="460" width="262" height="85" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="140.8108" y="475" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="155.9" y="489" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P2</text><text x="178.9892" y="489" font-size="15" font-weight="700" fill="#0F172A">差異分析</text><text x="192" y="509" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">P2a 分析、P2b 整理 CR</text><text x="192" y="528" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">範圍清單 → code → 切成模組</text><path d="M88,591 H207 L223,614.5 L207,638 H88 L72,614.5 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="147.5" y="620" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">G1 範圍核准</text><rect x="61" y="715" width="262" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="132.7858" y="730" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="147.875" y="744" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P3</text><text x="170.9642" y="744" font-size="15" font-weight="700" fill="#0F172A">架構與介面</text><text x="192" y="764" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">介面合約、記憶體預算</text><path d="M88,827 H207 L223,850.5 L207,874 H88 L72,850.5 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="147.5" y="856" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">G2 架構審查</text><rect x="61" y="951" width="262" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="92.5324" y="966" width="62.5352" height="19" rx="9.5" fill="#3B5BAA"/><text x="123.8" y="980" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M1–M7</text><text x="163.0676" y="980" font-size="15" font-weight="700" fill="#0F172A">每個模組各跑一次</text><text x="192" y="1000" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">見模組流程圖</text><rect x="40" y="1094" width="262" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="135.86079999999998" y="1109" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="150.95" y="1123" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P4</text><text x="174.0392" y="1123" font-size="15" font-weight="700" fill="#0F172A">整合</text><text x="171" y="1143" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">合入所有模組，驗端到端 boot flow</text><rect x="84" y="1237" width="262" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="163.8108" y="1252" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="178.9" y="1266" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P5</text><text x="201.9892" y="1266" font-size="15" font-weight="700" fill="#0F172A">全量驗收</text><text x="215" y="1286" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">regression、靜態分析、安全審查</text><path d="M95,1349 H246 L262,1372.5 L246,1396 H95 L79,1372.5 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="170.5" y="1378" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">G3 最終交付核准</text><rect x="84" y="1473" width="262" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="179.86079999999998" y="1488" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="194.95" y="1502" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P6</text><text x="218.0392" y="1502" font-size="15" font-weight="700" fill="#0F172A">交付</text><text x="215" y="1522" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">release／ROM tapeout</text><rect x="84" y="1585" width="262" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="179.86079999999998" y="1600" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="194.95" y="1614" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P7</text><text x="218.0392" y="1614" font-size="15" font-weight="700" fill="#0F172A">回寫</text><text x="215" y="1634" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">知識庫、規則、skill、hook</text><path d="M144,1697 H285 L301,1720.5 L285,1744 H144 L128,1720.5 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="214.5" y="1726" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">人確認回寫提案</text><rect x="262.1" y="365.5" width="104" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="314.1" y="380.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">範圍或設定要改</text><rect x="140" y="427" width="104" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="192" y="442" font-size="12.5" fill="#A61E4D" text-anchor="middle">基線缺測試結果</text><rect x="203" y="685.4" width="66" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="236" y="700.4" font-size="12.5" fill="#A61E4D" text-anchor="middle">範圍有誤</text><rect x="203" y="921.4" width="66" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="236" y="936.4" font-size="12.5" fill="#A61E4D" text-anchor="middle">介面衝突</text><rect x="150.5" y="1064.4" width="129" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="215" y="1079.4" font-size="12.5" fill="#A61E4D" text-anchor="middle">失敗：回對應的模組</text><rect x="262.9" y="1167.5" width="129" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="327.4" y="1182.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">失敗：回對應的模組</text><rect x="