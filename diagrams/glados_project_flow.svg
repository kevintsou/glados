e="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="180.5" y="242" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">G0 啟動核准</text><text x="180.5" y="262" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">固定專案範圍、起點、生成配方與環境</text><rect x="88" y="356" width="278" height="85" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="151.7358" y="371" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="166.82500000000002" y="385" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P1</text><text x="189.91420000000002" y="385" font-size="15" font-weight="700" fill="#0F172A">基底與基線建立</text><text x="227" y="405" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">派工：機械替換＋AI 移植＋獨立審查</text><text x="227" y="424" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">建立新專案的 code base，量出對照基準</text><rect x="53" y="487" width="256" height="47" rx="22" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.6" filter="url(#sh)"/><text x="181" y="516" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">保留的既有功能有 FAIL 嗎？</text><path d="M196,711 H339 L355,744 L339,777 H196 L180,744 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="267.5" y="740" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">GB 基線處置</text><text x="267.5" y="760" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">逐項決定每個 FAIL</text><rect x="129" y="925" width="278" height="85" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="232.86079999999998" y="940" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="247.95" y="954" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P2</text><text x="271.0392" y="954" font-size="15" font-weight="700" fill="#0F172A">規劃</text><text x="268" y="974" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">外部互動</text><text x="268" y="993" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">範圍 → code → 模組；介面與記憶體預算</text><path d="M133,1056 H310 L326,1089 L310,1122 H133 L117,1089 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="221.5" y="1085" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">G1 規劃核准</text><text x="221.5" y="1105" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">之後的需求變更走 C＋GC</text><rect x="129" y="1199" width="278" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="167.12" y="1214" width="65.36" height="19" rx="9.5" fill="#3B5BAA"/><text x="199.8" y="1228" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">模組流程</text><text x="240.48000000000002" y="1228" font-size="15" font-weight="700" fill="#0F172A">每個模組各跑一次</text><text x="268" y="1248" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">M1 → H → M2 → M4 → M5 → M6</text><rect x="106" y="1342" width="278" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="209.86079999999998" y="1357" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="224.95" y="1371" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P4</text><text x="248.0392" y="1371" font-size="15" font-weight="700" fill="#0F172A">整合</text><text x="245" y="1391" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">派工：合入所有模組，驗端到端 boot flow</text><rect x="152" y="1485" width="278" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="239.8108" y="1500" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="254.9" y="1514" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P5</text><text x="277.9892" y="1514" font-size="15" font-weight="700" fill="#0F172A">全量驗收</text><text x="291" y="1534" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">派工：regression、靜態分析、安全審查</text><path d="M169,1597 H320 L336,1620.5 L320,1644 H169 L153,1620.5 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="244.5" y="1626" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">G3 最終交付核准</text><rect x="152" y="1721" width="278" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="255.86079999999998" y="1736" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="270.95" y="1750" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P6</text><text x="294.0392" y="1750" font-size="15" font-weight="700" fill="#0F172A">交付</text><text x="291" y="1770" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">人：release／ROM tapeout</text><rect x="152" y="1833" width="278" height="85" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="255.86079999999998" y="1848" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="270.95" y="1862" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P7</text><text x="294.0392" y="1862" font-size="15" font-weight="700" fill="#0F172A">回寫</text><text x="291" y="1882" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">外部互動，不擋交付</text><text x="291" y="1901" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">知識庫、規則、skill、hook</text><rect x="209.5" y="583.45" width="29" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="224" y="598.45" font-size="12.5" fill="#1E293B" text-anchor="middle">有</text><rect x="124.5" y="698.5" width="41" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="145" y="713.5" font-size="12.5" fill="#1E293B" text-anchor="middle">沒有</text><rect x="222.5" y="823.7" width="91" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="268" y="838.7" font-size="12.5" fill="#1E293B" text-anchor="middle">接受或已處置</text><rect x="237" y="286.5" width="191" height="25" rx="6" fill="#