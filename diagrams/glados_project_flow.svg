23 514,615 L514,181 Q514,173 506,173 L320,173 Q312,173 312,165 L312,153" fill="none" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><path d="M231,699 L231,621 Q231,613 239,613 L298,613 Q306,613 306,605 L306,457 Q306,451 300,451 L300,451 Q294,451 294,445 L294,431" fill="none" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><path d="M276,1011 L276,962 Q276,954 284,954 L330,954 Q338,954 338,946 L338,831 Q338,823 330,823 L284,823 Q276,823 276,815 L276,803" fill="none" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><path d="M276,1266 L276,1212.5 Q276,1209 279.5,1209 L279.5,1209 Q283,1209 283,1205.5 L283,1119.5 Q283,1116 279.5,1116 L279.5,1116 Q276,1116 276,1112.5 L276,1096" fill="none" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><path d="M254,1409 L254,1360 Q254,1352 246,1352 L239,1352 Q231,1352 231,1344 L231,1332" fill="none" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><path d="M299,1552 L299,1503 Q299,1495 307,1495 L404,1495 Q412,1495 412,1487 L412,1360 Q412,1352 404,1352 L307,1352 Q299,1352 299,1344 L299,1332" fill="none" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><path d="M299,1788 L299,1739 Q299,1731 307,1731 L314,1731 Q322,1731 322,1723 L322,1646 Q322,1638 314,1638 L307,1638 Q299,1638 299,1630 L299,1618" fill="none" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><rect x="96" y="68" width="270" height="85" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="179.8108" y="83" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="194.9" y="97" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P0</text><text x="217.9892" y="97" font-size="15" font-weight="700" fill="#0F172A">專案啟動</text><text x="231" y="117" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">P0a 草擬、P0b 討論</text><text x="231" y="136" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">範圍清單、起點與生成配方、環境清單</text><path d="M79,203 H328 L344,236 L328,269 H79 L63,236 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="203.5" y="232" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">G0 啟動核准</text><text x="203.5" y="252" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">固定專案範圍、起點、生成配方與環境</text><rect x="114" y="346" width="270" height="85" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="173.7358" y="361" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="188.82500000000002" y="375" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P1</text><text x="211.91420000000002" y="375" font-size="15" font-weight="700" fill="#0F172A">基底與基線建立</text><text x="249" y="395" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">機械替換＋AI 移植＋獨立審查</text><text x="249" y="414" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">建立新專案的 code base，量出對照基準</text><path d="M59,508 H268 L284,550.5 L268,593 H59 L43,550.5 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="163.5" y="537" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">GB 基底核准</text><text x="163.5" y="557" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">基底 commit、移植審查、基線</text><text x="163.5" y="576" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">逐項處置基線 FAIL</text><rect x="96" y="699" width="270" height="104" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="179.8108" y="714" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="194.9" y="728" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P2</text><text x="217.9892" y="728" font-size="15" font-weight="700" fill="#0F172A">差異分析</text><text x="231" y="748" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">P2a 分析、P2b 整理 CR</text><text x="231" y="767" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">P2b 定案即更新 Jira（設定允許時）</text><text x="231" y="786" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">範圍清單 → code → 切成模組</text><path d="M71,849 H300 L316,891.5 L300,934 H71 L55,891.5 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="185.5" y="878" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">G1 需求基準核准</text><text x="185.5" y="898" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">需求來源、code 歸屬、模組切分</text><text x="185.5" y="917" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">第一次通過後，需求變更走 C＋GC</text><rect x="96" y="1011" width="270" height="85" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="171.7858" y="1026" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="186.875" y="1040" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P3</text><text x="209.9642" y="1040" font-size="15" font-weight="700" fill="#0F172A">架構與介面</text><text x="231" y="1060" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">依核准需求與切分定介面、預算</text><text x="231" y="1079" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">不自行重切模組或改需求</text><path d="M126,1142 H245 L261,1165.5 L245,1189 H126 L110,1165.5 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="185.5" y="1171" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">G2 架構審查</text><rect x="96" y="1266" width="270" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="131.5324" y="1281" width="62.5352" height="19" rx="9.5" fill="#3B5BAA"/><text x="162.8" y="1295" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M1–M7</text><text x="202.0676" y="1295" font-size="15" font-weight="700" fill="#0F172A">每個模組各跑一次</text><text x="231" y="1315" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">見模組流程圖</text><rect x="74" y="1409" width="270" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="173.86079999999998" y="1424" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="188.95" y="1438" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P4</text><text x="212.0392" y="1438" font-size="15" font-weight="700" fill="#0F172A">整合</text><text x="209" y="1458" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">合入所有模組，驗端到端 boot flow</text><rect x="119" y="1552" width="270" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="202.8108" y="1567" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="217.9" y="1581" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P5</text><text x="240.9892" y="1581" font-size="15" font-weight="700" fill="#0F172A">全量驗收</text><text x="254" y="1601" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">regression、靜態分析、安全審查</text><path d="M133,1664 H284 L300,1687.5 L284,1711 H133 L117,1687.5 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="208.5" y="1693" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">G3 最終交付核准</text><rect x="119" y="1788" width="270" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="218.86079999999998" y="1803" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="233.95" y="1817" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P6</text><text x="257.0392" y="1817" font-size="15" font-weight="700" fill="#0F172A">交付</text><text x="254" y="1837" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">release／ROM tapeout</text><rect x="119" y="1900" width="270" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="218.86079999999998" y="1915" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="233.95" y="1929" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P7</text><text x="257.0392" y="1929" font-size="15" font-weight="700" fill="#0F172A">回寫</text><text x="254" y="1949" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">知識庫、規則、skill、hook</text><path d="M183,2012 H324 L340,2035.5 L324,2059 H183 L167,2035.5 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="253.5" y="2041" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">人確認回寫提案</text><rect x="259.70000000000005" y="276.5" width="191" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="355.20000000000005" y="291.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">生成配方不足／要擴大移植範圍</text><rect x="57.5" y="478.4" width="131" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="123" y="493.4" font-size="12.5" fill="#A61E4D" text-anchor="middle">基線 FAIL 這版要改</text><rect x="300.75" y="610.5" width="104" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="352.75" y="625.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">範圍或設定要改</text><rect x="179" y="669.3" width="104" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="231" y="684.3" font-size="12.5" fill="#A61E4D" text-anchor="middle">基線缺測試結果</text><rect x="264.2" y="941.5" width="129" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="328.7" y="956.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">模組切分／歸屬有誤</text><rect x="243" y="1236.4" width="66" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="276" y="1251.4" font-size="12.5" fill="#A61E4D" text-anchor="middle">介面衝突</text><rect x="189.5" y="1379.4" width="129" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="254" y="1394.4" font-size="12.5" fill="#A61E4D" text-anchor="middle">失敗：回對應的模組</text><rect x="307.95" y="1482.5" width="129" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="372.45" y="1497.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">失敗：回對應的模組</text><rect x="222" y="1758.4" width="154" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="299" y="1773.4" font-size="12.5" fill="#A61E4D" text-anchor="middle">交付內容和核准版本不符</text>
