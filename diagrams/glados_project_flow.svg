ill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="200" y="242" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">G0 啟動核准</text><text x="200" y="262" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">固定專案範圍、起點、程式碼建立設定與環境</text><rect x="103" y="356" width="292" height="85" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="173.7358" y="371" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="188.82500000000002" y="385" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P1</text><text x="211.91420000000002" y="385" font-size="15" font-weight="700" fill="#0F172A">基底與基線建立</text><text x="249" y="405" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">派工：機械替換＋AI 移植＋獨立審查</text><text x="249" y="424" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">建立新專案的 code base，量出對照基準</text><rect x="72" y="487" width="256" height="47" rx="22" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.6" filter="url(#sh)"/><text x="200" y="516" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">保留的既有功能有 FAIL 嗎？</text><path d="M215,711 H358 L374,744 L358,777 H215 L199,744 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="286.5" y="740" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">GB 基線處置</text><text x="286.5" y="760" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">逐項決定每個 FAIL</text><rect x="141" y="925" width="292" height="85" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="251.86079999999998" y="940" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="266.95" y="954" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P2</text><text x="290.0392" y="954" font-size="15" font-weight="700" fill="#0F172A">規劃</text><text x="287" y="974" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">外部互動</text><text x="287" y="993" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">範圍 → code → 模組；介面與記憶體預算</text><path d="M149,1056 H326 L342,1089 L326,1122 H149 L133,1089 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="237.5" y="1085" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">G1 規劃核准</text><text x="237.5" y="1105" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">之後的需求變更走 C＋GC</text><rect x="141" y="1199" width="292" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="186.12" y="1214" width="65.36" height="19" rx="9.5" fill="#3B5BAA"/><text x="218.8" y="1228" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">模組流程</text><text x="259.48" y="1228" font-size="15" font-weight="700" fill="#0F172A">每個模組各跑一次</text><text x="287" y="1248" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">M1 → H → M2 → M4 → M5 → M6</text><rect x="117" y="1342" width="292" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="227.86079999999998" y="1357" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="242.95" y="1371" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P4</text><text x="266.0392" y="1371" font-size="15" font-weight="700" fill="#0F172A">整合</text><text x="263" y="1391" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">派工：合入所有模組，驗端到端 boot flow</text><rect x="166" y="1485" width="292" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="260.8108" y="1500" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="275.9" y="1514" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P5</text><text x="298.9892" y="1514" font-size="15" font-weight="700" fill="#0F172A">全量驗收</text><text x="312" y="1534" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">派工：regression、靜態分析、安全審查</text><path d="M187,1597 H338 L354,1620.5 L338,1644 H187 L171,1620.5 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="262.5" y="1626" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">G3 最終交付核准</text><rect x="166" y="1721" width="292" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="276.8608" y="1736" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="291.95" y="1750" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P6</text><text x="315.0392" y="1750" font-size="15" font-weight="700" fill="#0F172A">交付</text><text x="312" y="1770" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">人：release／ROM tapeout</text><rect x="166" y="1833" width="292" height="85" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="276.8608" y="1848" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="291.95" y="1862" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P7</text><text x="315.0392" y="1862" font-size="15" font-weight="700" fill="#0F172A">回寫</text><text x="312" y="1882" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">外部互動，不擋交付</text><text x="312" y="1901" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">知識庫、規則、skill、hook</text><rect x="228.5" y="583.45" width="29" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="243" y="598.45" font-size="12.5" fill="#1E293B" text-anchor="middle">有</text><rect x="143.5" y="698.5" width="41" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="164" y="713.5" font-size="12.5" fill="#1E293B" text-anchor="middle">沒有</text><rect x="241.5" y="823.7" width="91" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="287" y="838.7" font-size="12.5" fill="#1E293B" text-anchor="middle">接受或已處置</text><rect x="254.90000000000003" y="286.5" width="229" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="369.40000000000003" y="301.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">程式碼建立設定不足／要擴大移植範圍</text><rect x="332.3" y="622.5" width="131" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="397.8" y="637.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">基線 FAIL 這版要改</text><rect x="254" y="681.3" width="66" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="287" y="696.3" font-size="12.5" fill="#A61E4D" text-anchor="middle">移植問題</text><rect x="371.3" y="855.5" width="104" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="423.3" y="870.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">範圍或設定要改</text><rect x="303" y="1169.4" width="66" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="336" y="1184.4" font-size="12.5" fill="#A61E4D" text-anchor="middle">介面衝突</text><rect x="247.5" y="1312.4" width="129" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="312" y="1327.4" font-size="12.5" fill="#A61E4D" text-anchor="middle">失敗：回對應的模組</text><rect x="367.35" y="1415.5" width="129" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="431.85" y="1430.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">失敗：回對應的模組</text><rect x="284" y="1691.4" width="154" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="361" y="1706.4" font-size="12.5" fill="#A61E4D" text-anchor="middle">交付內容和核准版本不符</text>
