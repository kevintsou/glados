rect x="142.8108" y="326" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="157.9" y="340" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P1</text><text x="180.9892" y="340" font-size="15" font-weight="700" fill="#0F172A">基線建立</text><text x="194" y="360" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">確認起點能 build、能跑，留下對照基準</text><rect x="84" y="479" width="262" height="104" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="163.8108" y="494" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="178.9" y="508" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P2</text><text x="201.9892" y="508" font-size="15" font-weight="700" fill="#0F172A">差異分析</text><text x="215" y="528" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">P2a 分析、P2b 整理 CR</text><text x="215" y="547" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">P2b 定案即更新 Jira（設定允許時）</text><text x="215" y="566" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">範圍清單 → code → 切成模組</text><path d="M56,629 H285 L301,671.5 L285,714 H56 L40,671.5 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="170.5" y="658" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">G1 範圍核准</text><text x="170.5" y="678" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">審核整理後的結果、建立需求基準</text><text x="170.5" y="697" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">第一次通過後，需求變更走 C＋GC</text><rect x="84" y="791" width="262" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="155.7858" y="806" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="170.875" y="820" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P3</text><text x="193.9642" y="820" font-size="15" font-weight="700" fill="#0F172A">架構與介面</text><text x="215" y="840" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">介面合約、記憶體預算</text><path d="M111,903 H230 L246,926.5 L230,950 H111 L95,926.5 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="170.5" y="932" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">G2 架構審查</text><rect x="84" y="1027" width="262" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="115.5324" y="1042" width="62.5352" height="19" rx="9.5" fill="#3B5BAA"/><text x="146.8" y="1056" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M1–M7</text><text x="186.0676" y="1056" font-size="15" font-weight="700" fill="#0F172A">每個模組各跑一次</text><text x="215" y="1076" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">見模組流程圖</text><rect x="63" y="1170" width="262" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="158.86079999999998" y="1185" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="173.95" y="1199" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P4</text><text x="197.0392" y="1199" font-size="15" font-weight="700" fill="#0F172A">整合</text><text x="194" y="1219" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">合入所有模組，驗端到端 boot flow</text><rect x="107" y="1313" width="262" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="186.8108" y="1328" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="201.9" y="1342" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P5</text><text x="224.9892" y="1342" font-size="15" font-weight="700" fill="#0F172A">全量驗收</text><text x="238" y="1362" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">regression、靜態分析、安全審查</text><path d="M118,1425 H269 L285,1448.5 L269,1472 H118 L102,1448.5 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="193.5" y="1454" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">G3 最終交付核准</text><rect x="107" y="1549" width="262" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="202.86079999999998" y="1564" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="217.95" y="1578" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P6</text><text x="241.0392" y="1578" font-size="15" font-weight="700" fill="#0F172A">交付</text><text x="238" y="1598" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">release／ROM tapeout</text><rect x="107" y="1661" width="262" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="202.86079999999998" y="1676" width="30.1784" height="19" rx="9.5" fill="#3B5BAA"/><text x="217.95" y="1690" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P7</text><text x="241.0392" y="1690" font-size="15" font-weight="700" fill="#0F172A">回寫</text><text x="238" y="1710" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">知識庫、規則、skill、hook</text><path d="M167,1773 H308 L324,1796.5 L308,1820 H167 L151,1796.5 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="237.5" y="1802" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">人確認回寫提案</text><rect x="285.1" y="384.5" width="104" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="337.1" y="399.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">範圍或設定要改</text><rect x="163" y="446" width="104" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="215" y="461" font-size="12.5" fill="#A61E4D" text-anchor="middle">基線缺測試結果</text><rect x="264.4" y="721.5" width="66" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="297.4" y="736.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">範圍有誤</text><rect x="226" y="997.4" width="66" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="259" y="1012.4" font-size="12.5" fill="#A61E4D" text-anchor="middle">介面衝突</text><rect x="173.5" y="1140.4" width="129" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="238" y="1155.4" font-size="12.5" fill="#A61E4D" text-anchor="middle">失敗：回對應的模組</text><rect x="285.9" y="1243.5" width="129" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="350.4" y="1258.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">失敗：回對應的模組</text><rect x="226.25" y="1479.5" width="154" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="303.25" y="1494.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">交付內容和核准版本不符</text>
