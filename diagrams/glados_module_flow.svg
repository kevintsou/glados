 fill="#0F172A">需求釐清</text><text x="291" y="210" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">寫成有編號的 spec 條目</text><rect x="69" y="370" width="244" height="104" rx="10" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" stroke-dasharray="5 4" filter="url(#sh)"/><text x="191" y="399" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">等待外部回覆</text><text x="191" y="419" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">登記待確認事項</text><text x="191" y="438" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">設定允許時寫進 Jira，否則由人轉問</text><text x="191" y="457" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">答案回來再接續</text><path d="M299,277 H418 L434,300.5 L418,324 H299 L283,300.5 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="358.5" y="306" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">H1 需求核准</text><rect x="468" y="277" width="118" height="47" rx="22" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" filter="url(#sh)"/><text x="527" y="306" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">bug 型 CR</text><rect x="347" y="370" width="270" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="429.6552" y="385" width="32.489599999999996" height="19" rx="9.5" fill="#3B5BAA"/><text x="445.9" y="399" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M2</text><text x="470.1448" y="399" font-size="15" font-weight="700" fill="#0F172A">驗收定義</text><text x="482" y="419" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">驗收合約、case、判別能力證據</text><rect x="318" y="530" width="237" height="47" rx="22" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.6" filter="url(#sh)"/><text x="436.5" y="559" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">驗收合約有新增或變更嗎？</text><path d="M217,694 H368 L384,717.5 L368,741 H217 L201,717.5 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="292.5" y="723" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">H2 驗收合約核准</text><rect x="499" y="694" width="201" height="47" rx="22" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" filter="url(#sh)"/><text x="599.5" y="723" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">介面或記憶體預算變更</text><rect x="341" y="787" width="270" height="85" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="423.6552" y="802" width="32.489599999999996" height="19" rx="9.5" fill="#3B5BAA"/><text x="439.9" y="816" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M3</text><text x="464.1448" y="816" font-size="15" font-weight="700" fill="#0F172A">實作計畫</text><text x="476" y="836" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">另一個 session 審查計畫</text><text x="476" y="855" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">↻ 審查有阻擋項目：修計畫重審</text><rect x="296" y="949" width="270" height="85" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="365.3337" y="964" width="32.489599999999996" height="19" rx="9.5" fill="#3B5BAA"/><text x="381.5785" y="978" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M4</text><text x="405.8233" y="978" font-size="15" font-weight="700" fill="#0F172A">實作與 build</text><text x="431" y="998" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">只改計畫列出的檔案</text><text x="431" y="1017" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">↻ build 失敗或超預算：重做，最多 3 輪</text><rect x="251" y="1111" width="270" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="349.7052" y="1126" width="32.489599999999996" height="19" rx="9.5" fill="#3B5BAA"/><text x="365.95" y="1140" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M5</text><text x="390.1948" y="1140" font-size="15" font-weight="700" fill="#0F172A">驗證</text><text x="386" y="1160" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">跑驗收合約的必要 case</text><rect x="206" y="1342" width="270" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="288.6552" y="1357" width="32.489599999999996" height="19" rx="9.5" fill="#3B5BAA"/><text x="304.9" y="1371" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M6</text><text x="329.1448" y="1371" font-size="15" font-weight="700" fill="#0F172A">獨立審查</text><text x="341" y="1391" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">另一個執行者審查 diff</text><rect x="161" y="1556" width="270" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="243.6552" y="1571" width="32.489599999999996" height="19" rx="9.5" fill="#3B5BAA"/><text x="259.9" y="1585" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M7</text><text x="284.14480000000003" y="1585" font-size="15" font-weight="700" fill="#0F172A">完成交接</text><text x="296" y="1605" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">串接層核對全部紀錄</text><rect x="161" y="1703" width="179" height="47" rx="22" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" filter="url(#sh)"/><text x="250.5" y="1732" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">P4 整合（專案層）</text><rect x="492" y="1703" width="214" height="85" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="599" y="1732" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">R 失敗分類</text><text x="599" y="1752" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">決定退回哪裡（見失敗分類圖）</text><text x="599" y="1771" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">任何一站回報輸入不足也交給它</text><rect x="98" y="289.85" width="104" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="150" y="304.85" font-size="12.5" fill="#1E293B" text-anchor="middle">有問題要問外部</text><rect x="278.5" y="623.3" width="29" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="293" y="638.3" font-size="12.5" fill="#1E293B" text-anchor="middle">有</text><rect x="395" y="627.5" width="162" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="476" y="642.5" font-size="12.5" fill="#1E293B" text-anchor="middle">沒有，只在合約內補 case</text><rect x="269.5" y="1271.75" width="143" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="341" y="1286.75" font-size="12.5" fill="#1E293B" text-anchor="middle">必要 case 全部 PASS</text><rect x="225.5" y="1484.3" width="141" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="296" y="1499.3" font-size="12.5" fill="#1E293B" text-anchor="middle">沒有未處置的阻擋項目</text><rect x="536.25" y="483" width="157" height="42" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="614.75" y="498" font-size="12.5" fill="#A61E4D" text-anchor="middle">spec 條目轉不成 case、</text><text x="614.75" y="515" font-size="12.5" fill="#A61E4D" text-anchor="middle">平台觀察不到</text><rect x="525.25" y="910.5" width="104" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="577.25" y="925.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">需求或架構爭議</text><rect x="481.4" y="1072.5" width="141" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="551.9" y="1087.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">需要改計畫以外的檔案</text><rect x="438" y="1224" width="154" height="42" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="515" y="1239" font-size="12.5" fill="#A61E4D" text-anchor="middle">case FAIL、環境錯誤、</text><text x="515" y="1256" font-size="12.5" fill="#A61E4D" text-anchor="middle">驗證缺口</text><rect x="390.5" y="1446.5" width="66" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="423.5" y="1461.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">需要修正</text><rect x="349" y="1660.5" width="166" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="432" y="1675.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">紀錄不齊或對不上目前版本</text>
