ll="#0F172A">需求釐清</text><text x="217" y="210" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">寫成有編號的 spec 條目</text><rect x="107" y="366" width="129" height="85" rx="10" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" stroke-dasharray="5 4" filter="url(#sh)"/><text x="171.5" y="395" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">等待外部回覆</text><text x="171.5" y="415" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">問題寫進 Jira</text><text x="171.5" y="434" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">答案回來再接續</text><path d="M225,273 H344 L360,296.5 L344,320 H225 L209,296.5 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="284.5" y="302" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">H1 需求核准</text><rect x="394" y="273" width="118" height="47" rx="22" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" filter="url(#sh)"/><text x="453" y="302" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">bug 型 CR</text><rect x="273" y="366" width="270" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="355.6552" y="381" width="32.489599999999996" height="19" rx="9.5" fill="#3B5BAA"/><text x="371.9" y="395" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M2</text><text x="396.1448" y="395" font-size="15" font-weight="700" fill="#0F172A">驗收定義</text><text x="408" y="415" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">驗收合約、case、判別能力證據</text><rect x="244" y="526" width="237" height="47" rx="22" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.6" filter="url(#sh)"/><text x="362.5" y="555" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">驗收合約有新增或變更嗎？</text><path d="M143,690 H294 L310,713.5 L294,737 H143 L127,713.5 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="218.5" y="719" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">H2 驗收合約核准</text><rect x="425" y="690" width="201" height="47" rx="22" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" filter="url(#sh)"/><text x="525.5" y="719" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">介面或記憶體預算變更</text><rect x="267" y="783" width="270" height="85" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="349.6552" y="798" width="32.489599999999996" height="19" rx="9.5" fill="#3B5BAA"/><text x="365.9" y="812" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M3</text><text x="390.1448" y="812" font-size="15" font-weight="700" fill="#0F172A">實作計畫</text><text x="402" y="832" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">另一個 session 審查計畫</text><text x="402" y="851" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">↻ 審查有阻擋項目：修計畫重審</text><rect x="222" y="945" width="270" height="85" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="291.3337" y="960" width="32.489599999999996" height="19" rx="9.5" fill="#3B5BAA"/><text x="307.5785" y="974" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M4</text><text x="331.8233" y="974" font-size="15" font-weight="700" fill="#0F172A">實作與 build</text><text x="357" y="994" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">只改計畫列出的檔案</text><text x="357" y="1013" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">↻ build 失敗或超預算：重做，最多 3 輪</text><rect x="177" y="1107" width="270" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="275.7052" y="1122" width="32.489599999999996" height="19" rx="9.5" fill="#3B5BAA"/><text x="291.95" y="1136" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M5</text><text x="316.1948" y="1136" font-size="15" font-weight="700" fill="#0F172A">驗證</text><text x="312" y="1156" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">跑驗收合約的必要 case</text><rect x="132" y="1338" width="270" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="214.6552" y="1353" width="32.489599999999996" height="19" rx="9.5" fill="#3B5BAA"/><text x="230.9" y="1367" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M6</text><text x="255.1448" y="1367" font-size="15" font-weight="700" fill="#0F172A">獨立審查</text><text x="267" y="1387" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">另一個執行者審查 diff</text><rect x="87" y="1552" width="270" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="169.6552" y="1567" width="32.489599999999996" height="19" rx="9.5" fill="#3B5BAA"/><text x="185.9" y="1581" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M7</text><text x="210.1448" y="1581" font-size="15" font-weight="700" fill="#0F172A">完成交接</text><text x="222" y="1601" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">串接層核對全部紀錄</text><rect x="87" y="1699" width="179" height="47" rx="22" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" filter="url(#sh)"/><text x="176.5" y="1728" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">P4 整合（專案層）</text><rect x="418" y="1699" width="214" height="66" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="525" y="1728" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">R 失敗分類</text><text x="525" y="1748" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">決定退回哪裡（見失敗分類圖）</text><rect x="98" y="284" width="104" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="150" y="299" font-size="12.5" fill="#1E293B" text-anchor="middle">有問題要問外部</text><rect x="204.5" y="619.3" width="29" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="219" y="634.3" font-size="12.5" fill="#1E293B" text-anchor="middle">有</text><rect x="321" y="623.5" width="162" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="402" y="638.5" font-size="12.5" fill="#1E293B" text-anchor="middle">沒有，只在合約內補 case</text><rect x="195.5" y="1267.75" width="143" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="267" y="1282.75" font-size="12.5" fill="#1E293B" text-anchor="middle">必要 case 全部 PASS</text><rect x="151.5" y="1480.3" width="141" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="222" y="1495.3" font-size="12.5" fill="#1E293B" text-anchor="middle">沒有未處置的阻擋項目</text><rect x="462.25" y="479" width="157" height="42" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="540.75" y="494" font-size="12.5" fill="#A61E4D" text-anchor="middle">spec 條目轉不成 case、</text><text x="540.75" y="511" font-size="12.5" fill="#A61E4D" text-anchor="middle">平台觀察不到</text><rect x="451.25" y="906.5" width="104" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="503.25" y="921.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">需求或架構爭議</text><rect x="407.4" y="1068.5" width="141" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="477.9" y="1083.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">需要改計畫以外的檔案</text><rect x="364" y="1220" width="154" height="42" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="441" y="1235" font-size="12.5" fill="#A61E4D" text-anchor="middle">case FAIL、環境錯誤、</text><text x="441" y="1252" font-size="12.5" fill="#A61E4D" text-anchor="middle">驗證缺口</text><rect x="316.5" y="1442.5" width="66" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="349.5" y="1457.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">需要修正</text><rect x="275" y="1656.5" width="166" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="358" y="1671.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">紀錄不齊或對不上目前版本</text>
