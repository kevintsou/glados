6" stroke-width="1.3" filter="url(#sh)"/><rect x="246.6552" y="176" width="32.489599999999996" height="19" rx="9.5" fill="#3B5BAA"/><text x="262.9" y="190" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M1</text><text x="287.14480000000003" y="190" font-size="15" font-weight="700" fill="#0F172A">需求釐清</text><text x="299" y="210" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">寫成有編號的 spec 條目</text><rect x="69" y="370" width="244" height="104" rx="10" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" stroke-dasharray="5 4" filter="url(#sh)"/><text x="191" y="399" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">等待外部回覆</text><text x="191" y="419" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">登記待確認事項</text><text x="191" y="438" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">設定允許時寫進 Jira，否則由人轉問</text><text x="191" y="457" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">答案回來再接續</text><path d="M311,277 H430 L446,300.5 L430,324 H311 L295,300.5 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="370.5" y="306" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">H1 需求核准</text><rect x="480" y="277" width="118" height="47" rx="22" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" filter="url(#sh)"/><text x="539" y="306" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">bug 型 CR</text><rect x="347" y="370" width="288" height="85" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="438.6552" y="385" width="32.489599999999996" height="19" rx="9.5" fill="#3B5BAA"/><text x="454.9" y="399" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M2</text><text x="479.1448" y="399" font-size="15" font-weight="700" fill="#0F172A">驗收定義</text><text x="491" y="419" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">驗收合約、case、判別能力證據</text><text x="491" y="438" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">先完成獨立審查與工具檢查</text><rect x="300" y="553" width="237" height="47" rx="22" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.6" filter="url(#sh)"/><text x="418.5" y="582" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">驗收合約有新增或變更嗎？</text><path d="M430,748 H581 L597,771.5 L581,795 H430 L414,771.5 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="505.5" y="777" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">H2 驗收合約核准</text><rect x="295" y="912" width="253" height="66" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="421.5" y="941" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">建立測試基準，M2 完成</text><text x="421.5" y="961" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">串接層核對目前版本的證據與合約核准</text><rect x="582" y="931" width="201" height="47" rx="22" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" filter="url(#sh)"/><text x="682.5" y="960" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">介面或記憶體預算變更</text><rect x="476" y="1024" width="288" height="85" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="567.6552" y="1039" width="32.489599999999996" height="19" rx="9.5" fill="#3B5BAA"/><text x="583.9000000000001" y="1053" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M3</text><text x="608.1448" y="1053" font-size="15" font-weight="700" fill="#0F172A">實作計畫</text><text x="620" y="1073" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">另一個 session 審查計畫</text><text x="620" y="1092" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">↻ 審查有阻擋項目：修計畫重審，最多 3 輪</text><rect x="428" y="1186" width="288" height="85" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="506.3337" y="1201" width="32.489599999999996" height="19" rx="9.5" fill="#3B5BAA"/><text x="522.5785000000001" y="1215" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M4</text><text x="546.8233" y="1215" font-size="15" font-weight="700" fill="#0F172A">實作與 build</text><text x="572" y="1235" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">只改計畫列出的檔案</text><text x="572" y="1254" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">↻ build 失敗或超預算：重做，最多 3 輪</text><rect x="380" y="1348" width="288" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="487.7052" y="1363" width="32.489599999999996" height="19" rx="9.5" fill="#3B5BAA"/><text x="503.95" y="1377" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M5</text><text x="528.1948" y="1377" font-size="15" font-weight="700" fill="#0F172A">驗證</text><text x="524" y="1397" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">跑驗收合約的必要 case</text><rect x="332" y="1579" width="288" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="423.6552" y="1594" width="32.489599999999996" height="19" rx="9.5" fill="#3B5BAA"/><text x="439.9" y="1608" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M6</text><text x="464.1448" y="1608" font-size="15" font-weight="700" fill="#0F172A">獨立審查</text><text x="476" y="1628" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">另一個執行者審查 diff</text><rect x="284" y="1793" width="288" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="375.6552" y="1808" width="32.489599999999996" height="19" rx="9.5" fill="#3B5BAA"/><text x="391.9" y="1822" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M7</text><text x="416.1448" y="1822" font-size="15" font-weight="700" fill="#0F172A">完成交接</text><text x="428" y="1842" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">串接層核對全部紀錄</text><rect x="290" y="1936" width="179" height="47" rx="22" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" filter="url(#sh)"/><text x="379.5" y="1965" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">P4 整合（專案層）</text><rect x="622" y="1936" width="214" height="85" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="729" y="1965" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">R 失敗分類</text><text x="729" y="1985" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">決定退回哪裡（見失敗分類圖）</text><text x="729" y="2004" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">任何一站回報輸入不足也交給它</text><rect x="98" y="289.85" width="104" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="150" y="304.85" font-size="12.5" fill="#1E293B" text-anchor="middle">有問題要問外部</text><rect x="443.5" y="646.65" width="29" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="458" y="661.65" font-size="12.5" fill="#1E293B" text-anchor="middle">有</text><rect x="443.5" y="841.3" width="41" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="464" y="856.3" font-size="12.5" fill="#1E293B" text-anchor="middle">核准</text><rect x="471.5" y="718.4" width="129" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="536" y="733.4" font-size="12.5" fill="#A61E4D" text-anchor="middle">不核准：修正並重檢</text><rect x="302" y="712.3" width="154" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="379" y="727.3" font-size="12.5" fill="#1E293B" text-anchor="middle">沒有，沿用有效合約核准</text><rect x="404.5" y="1508.75" width="143" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="476" y="1523.75" font-size="12.5" fill="#1E293B" text-anchor="middle">必要 case 全部 PASS</text><rect x="357.5" y="1721.3" width="141" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="428" y="1736.3" font-size="12.5" fill="#1E293B" text-anchor="middle">沒有未處置的阻擋項目</text><rect x="569.2" y="502" width="157" height="42" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="647.7" y="517" font-size="12.5" fill="#A61E4D" text-anchor="middle">spec 條目轉不成 case、</text><text x="647.7" y="534" font-size="12.5" fill="#A61E4D" text-anchor="middle">平台觀察不到</text><rect x="677" y="1147.5" width="104" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="729" y="1162.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">需求或架構爭議</text><rect x="623.75" y="1309.5" width="141" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="694.25" y="1324.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">需要改計畫以外的檔案</text><rect x="580.2" y="1461" width="154" height="42" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="657.2" y="1476" font-size="12.5" fill="#A61E4D" text-anchor="middle">case FAIL、環境錯誤、</text><text x="657.2" y="1493" font-size="12.5" fill="#A61E4D" text-anchor="middle">驗證缺口</text><rect x="530.75" y="1683.5" width="66" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="563.75" y="1698.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">需要修正</text><rect x="481.5" y="1897.5" width="166" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="564.5" y="1912.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">紀錄不齊或對不上目前版本</text>
