"755" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M4</text><text x="508.1948" y="755" font-size="15" font-weight="700" fill="#0F172A">實作</text><text x="504" y="775" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">規劃＋改 code＋build</text><text x="504" y="794" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">↻ build、warning、預算沒過：重做，最多 3 輪</text><rect x="305" y="950" width="314" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="425.7052" y="965" width="32.489599999999996" height="19" rx="9.5" fill="#3B5BAA"/><text x="441.95" y="979" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M5</text><text x="466.1948" y="979" font-size="15" font-weight="700" fill="#0F172A">驗證</text><text x="462" y="999" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">跑驗收合約的必要 case</text><rect x="357" y="1164" width="314" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><rect x="461.6552" y="1179" width="32.489599999999996" height="19" rx="9.5" fill="#3B5BAA"/><text x="477.9" y="1193" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M6</text><text x="502.1448" y="1193" font-size="15" font-weight="700" fill="#0F172A">獨立審查</text><text x="514" y="1213" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">另一個執行者審查 diff</text><rect x="450" y="1347" width="128" height="66" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="514" y="1376" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">模組完成</text><text x="514" y="1396" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">串接層直接判斷</text><rect x="424" y="1459" width="179" height="47" rx="22" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" filter="url(#sh)"/><text x="513.5" y="1488" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">P4 整合（專案層）</text><rect x="757" y="931" width="223" height="85" rx="10" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3" filter="url(#sh)"/><text x="868.5" y="960" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">交給人</text><text x="868.5" y="980" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">需求、合約、介面、測試寫錯、</text><text x="868.5" y="999" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">環境問題、驗證缺口、超過 3 輪</text><rect x="98" y="329.55" width="104" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="150" y="344.55" font-size="12.5" fill="#1E293B" text-anchor="middle">有問題要問外部</text><rect x="390.5" y="1062.7" width="143" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="462" y="1077.7" font-size="12.5" fill="#1E293B" text-anchor="middle">必要 case 全部 PASS</text><rect x="443.5" y="1276" width="141" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="514" y="1291" font-size="12.5" fill="#1E293B" text-anchor="middle">沒有未處置的阻擋項目</text><rect x="350.5" y="293.4" width="91" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="396" y="308.4" font-size="12.5" fill="#A61E4D" text-anchor="middle">不核准：修正</text><rect x="419" y="919.75" width="190" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="514" y="934.75" font-size="12.5" fill="#A61E4D" text-anchor="middle">case FAIL：回 M4，計入輪數</text><rect x="569.6" y="1094.5" width="144" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="641.6" y="1109.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">阻擋項目：回 M4 修正</text><rect x="561.4" y="567" width="132" height="42" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="627.4" y="582" font-size="12.5" fill="#A61E4D" text-anchor="middle">spec 轉不成 case、</text><text x="627.4" y="599" font-size="12.5" fill="#A61E4D" text-anchor="middle">平台觀察不到</text><rect x="604.25" y="868" width="104" height="42" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="656.25" y="883" font-size="12.5" fill="#A61E4D" text-anchor="middle">超過 3 輪、</text><text x="656.25" y="900" font-size="12.5" fill="#A61E4D" text-anchor="middle">牽涉需求或介面</text>
