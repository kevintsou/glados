 x="498" y="412.7" width="66" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="531" y="427.7" font-size="12.5" fill="#1E293B" text-anchor="middle">答案回來</text><rect x="205" y="566.7" width="116" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="263" y="581.7" font-size="12.5" fill="#A61E4D" text-anchor="middle">沒過，本節點重做</text><rect x="507.29999999999995" y="836.5" width="91" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="552.8" y="851.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">不核准，修正</text><rect x="114.5" y="465.05" width="141" height="42" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="185" y="480.05" font-size="12.5" fill="#A61E4D" text-anchor="middle">沒過，退回其他節點；</text><text x="185" y="497.05" font-size="12.5" fill="#A61E4D" text-anchor="middle">或執行期間輸入被改</text><rect x="516.5" y="1038.5" width="66" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="549.5" y="1053.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">輸出過期</text><rect x="192.5" y="695.2" width="141" height="42" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="263" y="710.2" font-size="12.5" fill="#A61E4D" text-anchor="middle">超過輪數、環境問題、</text><text x="263" y="727.2" font-size="12.5" fill="#A61E4D" text-anchor="middle">判不出原因</text>
