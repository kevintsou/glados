<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="1302" viewBox="0 0 1010 1302" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei','Noto Sans CJK TC',system-ui,-apple-system,'Segoe UI',sans-serif" role="img" aria-label="節點狀態">
<defs><marker id="a-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#64748B"/></marker><marker id="a-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#D6336C"/></marker><marker id="a-wait" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#94A3B8"/></marker><marker id="a-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#334155"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs>
<rect x="0.5" y="0.5" width="1009" height="1301" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="28" y="36" font-size="19" font-weight="700" fill="#0F172A">節點狀態</text><text x="123.32000000000001" y="36" font-size="13" fill="#64748B">專案層節點每專案一份，模組層節點每模組一份</text>
<line x1="28" y1="1248" x2="982" y2="1248" stroke="#E2E8F0"/>
<path d="M355,115 L355,232" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M342,279 L342,400" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M321,447 L321,658" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M321,705 L321,765 Q321,773 329,773 L527,773 Q535,773 535,781 L535,896 Q535,904 527,904 L482,904 Q474,904 474,912 L474,965" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M495,1012 L495,1171.2945288743479" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M257,705 L257,765 Q257,773 249,773 L158,773 Q150,773 150,781 L150,1102 Q150,1110 158,1110 L455,1110 Q463,1110 463,1118 L463,1171.9863147474186" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M363,447 L363,459 Q363,467 371,467 L506,467 Q514,467 514,475 L514,658" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="3 4" marker-end="url(#a-wait)"/><path d="M557,658 L557,317 Q557,309 549,309 L376,309 Q368,309 368,301 L368,279" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="3 4" marker-end="url(#a-wait)"/><path d="M289,658 L289,546 Q289,538 281,538 L234,538 Q226,538 226,530 L226,307 Q226,299 234,299 L309,299 Q317,299 317,291 L317,279" fill="none" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><path d="M516,954.53125 L516,922 Q516,914 524,914 L614,914 Q622,914 622,906 L622,307 Q622,299 614,299 L401,299 Q393,299 393,291 L393,279" fill="none" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><path d="M257,658 L257,556 Q257,548 249,548 L219,548 Q211,548 211,540 L211,143 Q211,135 219,135 L315,135 Q323,135 323,127 L323,115" fill="none" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><path d="M527,1167.4358969087382 L527,1118 Q527,1110 535,1110 L629,1110 Q637,1110 637,1102 L637,143 Q637,135 629,135 L395,135 Q387,135 387,127 L387,115" fill="none" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><path d="M289,705 L289,799" fill="none" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><path d="M289,884 L289,934" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><rect x="291" y="68" width="128" height="47" rx="8" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><text x="355" y="97" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">待開始</text><rect x="291" y="232" width="128" height="47" rx="8" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><text x="355" y="261" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">可開始</text><rect x="278" y="400" width="128" height="47" rx="8" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><text x="342" y="429" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">執行中</text><rect x="471" y="658" width="129" height="47" rx="10" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" stroke-dasharray="5 4" filter="url(#sh)"/><text x="535.5" y="687" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">等待外部回覆</text><rect x="225" y="658" width="128" height="47" rx="8" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><text x="289" y="687" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">交接檢查中</text><path d="M447,965 H543 L559,988.5 L543,1012 H447 L431,988.5 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="495" y="994" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">等待核准</text><path d="M431,1174 A64,7 0 0 1 559,1174 V1221 A64,7 0 0 1 431,1221 Z M431,1174 A64,7 0 0 0 559,1174" fill="#EBFBEE" stroke="#51A86A" stroke-width="1.3" filter="url(#sh)"/><text x="495" y="1203" font-size="15" font-weight="700" fill="#1E5631" text-anchor="middle">完成</text><rect x="173" y="799" width="231" height="85" rx="10" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3" filter="url(#sh)"/><text x="288.5" y="828" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">交給人</text><text x="288.5" y="848" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">任何狀態都可能轉到這裡</text><text x="288.5" y="867" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">例如有衝突，或核准人決定交給人</text><rect x="191" y="934" width="196" height="85" rx="22" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" filter="url(#sh)"/><text x="289" y="963" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">依人的決定回到流程</text><text x="289" y="983" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">重跑、退回其他節點，</text><text x="289" y="1002" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">或人自己做完交出交接清單</text><rect x="309.5" y="161" width="91" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="355" y="176" font-size="12.5" fill="#1E293B" text-anchor="middle">進入條件滿足</text><rect x="321.5" y="327" width="41" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="342" y="342" font-size="12.5" fill="#1E293B" text-anchor="middle">派工</text><rect x="288" y="497.8" width="66" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="321" y="512.8" font-size="12.5" fill="#1E293B" text-anchor="middle">執行結束</text><rect x="489.5" y="826" width="91" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="535" y="841" font-size="12.5" fill="#1E293B" text-anchor="middle">通過，有關卡</text><rect x="474.5" y="1063.217811549739" width="41" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="495" y="1078.217811549739" font-size="12.5" fill="#1E293B" text-anchor="middle">核准</text><rect x="98" y="1030.1000000000001" width="104" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="150" y="1045.1000000000001" font-size="12.5" fill="#1E293B" text-anchor="middle">通過，沒有關卡</text><rect x="443.25" y="454.5" width="66" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="476.25" y="469.5" font-size="12.5" fill="#1E293B" text-anchor="middle">要問外部</text><rect x="524" y="418.65" width="66" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="557" y="433.65" font-size="12.5" fill="#1E293B" text-anchor="middle">答案回來</text><rect x="224.5" y="571" width="129" height="42" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="289" y="586" font-size="12.5" fill="#A61E4D" text-anchor="middle">沒過，本節點重做；</text><text x="289" y="603" font-size="12.5" fill="#A61E4D" text-anchor="middle">輸入被改要重跑</text><rect x="523.5" y="901.5" width="91" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="569" y="916.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">不核准，修正</text><rect x="140.5" y="465.05" width="141" height="42" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="211" y="480.05" font-size="12.5" fill="#A61E4D" text-anchor="middle">沒過，退回其他節點；</text><text x="211" y="497.05" font-size="12.5" fill="#A61E4D" text-anchor="middle">輸入被改，等上游新版</text><rect x="532.5" y="1097.5" width="66" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="565.5" y="1112.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">輸出過期</text><rect x="218.5" y="712.2" width="141" height="42" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="289" y="727.2" font-size="12.5" fill="#A61E4D" text-anchor="middle">超過輪數、環境問題、</text><text x="289" y="744.2" font-size="12.5" fill="#A61E4D" text-anchor="middle">判不出原因</text>
<rect x="28" y="1264" width="26" height="16" rx="4" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3"/><text x="60" y="1276.5" font-size="12.5" fill="#475569">狀態</text><rect x="107" y="1264" width="26" height="16" rx="4" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" stroke-dasharray="4 3"/><text x="139" y="1276.5" font-size="12.5" fill="#475569">等待</text><path d="M192,1264 H206 L212,1272 L206,1280 H192 L186,1272 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3"/><text x="218" y="1276.5" font-size="12.5" fill="#475569">人工關卡</text><rect x="290" y="1264" width="26" height="16" rx="4" fill="#EBFBEE" stroke="#51A86A" stroke-width="1.3"/><text x="322" y="1276.5" font-size="12.5" fill="#475569">紀錄</text><rect x="369" y="1264" width="26" height="16" rx="4" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3"/><text x="401" y="1276.5" font-size="12.5" fill="#475569">需要人</text><rect x="460.5" y="1264" width="26" height="16" rx="8" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3"/><text x="492.5" y="1276.5" font-size="12.5" fill="#475569">圖外的節點或起點</text><path d="M614.5,1272 H644.5" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><text x="652.5" y="1276.5" font-size="12.5" fill="#475569">正常往下走</text><path d="M737,1272 H767" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="3 4" marker-end="url(#a-wait)"/><text x="775" y="1276.5" font-size="12.5" fill="#475569">等待或補充</text><path d="M859.5,1272 H889.5" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><text x="897.5" y="1276.5" font-size="12.5" fill="#475569">失敗或退回</text>
</svg>
