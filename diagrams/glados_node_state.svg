<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="1298" viewBox="0 0 1010 1298" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei','Noto Sans CJK TC',system-ui,-apple-system,'Segoe UI',sans-serif" role="img" aria-label="節點狀態">
<defs><marker id="a-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#64748B"/></marker><marker id="a-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#D6336C"/></marker><marker id="a-wait" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#94A3B8"/></marker><marker id="a-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#334155"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs>
<rect x="0.5" y="0.5" width="1009" height="1297" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="28" y="36" font-size="19" font-weight="700" fill="#0F172A">節點狀態</text><text x="123.32000000000001" y="36" font-size="13" fill="#64748B">專案層節點每專案一份，模組層節點每模組一份</text>
<line x1="28" y1="1244" x2="982" y2="1244" stroke="#E2E8F0"/>
<path d="M355,115 L355,232" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M342,279 L342,400" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M321,447 L321,658" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M321,705 L321,765 Q321,773 329,773 L527,773 Q535,773 535,781 L535,896 Q535,904 527,904 L518,904 Q510,904 510,912 L510,961" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M531,1008 L531,1167.2945288743479" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M257,705 L257,765 Q257,773 249,773 L158,773 Q150,773 150,781 L150,1098 Q150,1106 158,1106 L491,1106 Q499,1106 499,1114 L499,1167.9863147474186" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M363,447 L363,459 Q363,467 371,467 L506,467 Q514,467 514,475 L514,658" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="3 4" marker-end="url(#a-wait)"/><path d="M557,658 L557,317 Q557,309 549,309 L376,309 Q368,309 368,301 L368,279" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="3 4" marker-end="url(#a-wait)"/><path d="M289,658 L289,546 Q289,538 281,538 L234,538 Q226,538 226,530 L226,307 Q226,299 234,299 L309,299 Q317,299 317,291 L317,279" fill="none" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><path d="M552,950.53125 L552,912 Q552,904 560,904 L614,904 Q622,904 622,896 L622,307 Q622,299 614,299 L401,299 Q393,299 393,291 L393,279" fill="none" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><path d="M257,658 L257,556 Q257,548 249,548 L219,548 Q211,548 211,540 L211,143 Q211,135 219,135 L315,135 Q323,135 323,127 L323,115" fill="none" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><path d="M563,1163.4358969087382 L563,1114 Q563,1106 571,1106 L665,1106 Q673,1106 673,1098 L673,143 Q673,135 665,135 L395,135 Q387,135 387,127 L387,115" fill="none" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><path d="M289,705 L289,799" fill="none" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><path d="M289,884 L289,896 Q289,904 297,904 L301,904 Q309,904 309,912 L309,930" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><rect x="291" y="68" width="128" height="47" rx="8" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><text x="355" y="97" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">待開始</text><rect x="291" y="232" width="128" height="47" rx="8" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><text x="355" y="261" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">可開始</text><rect x="278" y="400" width="128" height="47" rx="8" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><text x="342" y="429" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">執行中</text><rect x="471" y="658" width="129" height="47" rx="10" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" stroke-dasharray="5 4" filter="url(#sh)"/><text x="535.5" y="687" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">等待外部回覆</text><rect x="225" y="658" width="128" height="47" rx="8" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><text x="289" y="687" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">交接檢查中</text><path d="M483,961 H579 L595,984.5 L579,1008 H483 L467,984.5 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="531" y="990" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">等待核准</text><path d="M467,1170 A64,7 0 0 1 595,1170 V1217 A64,7 0 0 1 467,1217 Z M467,1170 A64,7 0 0 0 595,1170" fill="#EBFBEE" stroke="#51A86A" stroke-width="1.3" filter="url(#sh)"/><text x="531" y="1199" font-size="15" font-weight="700" fill="#1E5631" text-anchor="middle">完成</text><rect x="173" y="799" width="231" height="85" rx="10" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3" filter="url(#sh)"/><text x="288.5" y="828" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">交給人</text><text x="288.5" y="848" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">任何狀態都可能轉到這裡</text><text x="288.5" y="867" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">例如有衝突，或核准人決定交給人</text><rect x="185" y="930" width="248" height="85" rx="22" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" filter="url(#sh)"/><text x="309" y="959" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">依人的決定回到流程</text><text x="309" y="979" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">自己做、指定退回、修好環境重跑、</text><text x="309" y="998" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">讓同一站再試，或這版不做</text><rect x="309.5" y="161" width="91" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="355" y="176" font-size="12.5" fill="#1E293B" text-anchor="middle">進入條件滿足</text><rect x="321.5" y="327" width="41" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="342" y="342" font-size="12.5" fill="#1E293B" text-anchor="middle">派工</text><rect x="288" y="497.8" width="66" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="321" y="512.8" font-size="12.5" fill="#1E293B" text-anchor="middle">執行結束</text><rect x="489.5" y="826" width="91" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="535" y="841" font-size="12.5" fill="#1E293B" text-anchor="middle">通過，有關卡</text><rect x="510.5" y="1059.217811549739" width="41" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="531" y="1074.217811549739" font-size="12.5" fill="#1E293B" text-anchor="middle">核准</text><rect x="98" y="893.7" width="104" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="150" y="908.7" font-size="12.5" fill="#1E293B" text-anchor="middle">通過，沒有關卡</text><rect x="443.25" y="454.5" width="66" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="476.25" y="469.5" font-size="12.5" fill="#1E293B" text-anchor="middle">要問外部</text><rect x="524" y="418.65" width="66" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="557" y="433.65" font-size="12.5" fill="#1E293B" text-anchor="middle">答案回來</text><rect x="224.5" y="571" width="129" height="42" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="289" y="586" font-size="12.5" fill="#A61E4D" text-anchor="middle">沒過，本節點重做；</text><text x="289" y="603" font-size="12.5" fill="#A61E4D" text-anchor="middle">輸入被改要重跑</text><rect x="559" y="891.5" width="91" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="604.5" y="906.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">不核准，修正</text><rect x="140.5" y="465.05" width="141" height="42" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="211" y="480.05" font-size="12.5" fill="#A61E4D" text-anchor="middle">沒過，退回其他節點；</text><text x="211" y="497.05" font-size="12.5" fill="#A61E4D" text-anchor="middle">輸入被改，等上游新版</text><rect x="568.5" y="1093.5" width="66" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="601.5" y="1108.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">輸出過期</text><rect x="218.5" y="712.2" width="141" height="42" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="289" y="727.2" font-size="12.5" fill="#A61E4D" text-anchor="middle">超過輪數、環境問題、</text><text x="289" y="744.2" font-size="12.5" fill="#A61E4D" text-anchor="middle">判不出原因</text>
<rect x="28" y="1260" width="26" height="16" rx="4" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3"/><text x="60" y="1272.5" font-size="12.5" fill="#475569">狀態</text><rect x="107" y="1260" width="26" height="16" rx="4" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" stroke-dasharray="4 3"/><text x="139" y="1272.5" font-size="12.5" fill="#475569">等待</text><path d="M192,1260 H206 L212,1268 L206,1276 H192 L186,1268 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3"/><text x="218" y="1272.5" font-size="12.5" fill="#475569">人工關卡</text><rect x="290" y="1260" width="26" height="16" rx="4" fill="#EBFBEE" stroke="#51A86A" stroke-width="1.3"/><text x="322" y="1272.5" font-size="12.5" fill="#475569">紀錄</text><rect x="369" y="1260" width="26" height="16" rx="4" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3"/><text x="401" y="1272.5" font-size="12.5" fill="#475569">需要人</text><rect x="460.5" y="1260" width="26" height="16" rx="8" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3"/><text x="492.5" y="1272.5" font-size="12.5" fill="#475569">圖外的節點或起點</text><path d="M614.5,1268 H644.5" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><text x="652.5" y="1272.5" font-size="12.5" fill="#475569">正常往下走</text><path d="M737,1268 H767" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="3 4" marker-end="url(#a-wait)"/><text x="775" y="1272.5" font-size="12.5" fill="#475569">等待或補充</text><path d="M859.5,1268 H889.5" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><text x="897.5" y="1272.5" font-size="12.5" fill="#475569">失敗或退回</text>
</svg>
