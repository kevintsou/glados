<svg xmlns="http://www.w3.org/2000/svg" width="846" height="1579" viewBox="0 0 846 1579" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei','Noto Sans CJK TC',system-ui,-apple-system,'Segoe UI',sans-serif" role="img" aria-label="一次派工到放行">
<defs><marker id="a-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#64748B"/></marker><marker id="a-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#D6336C"/></marker><marker id="a-wait" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#94A3B8"/></marker><marker id="a-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#334155"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs>
<rect x="0.5" y="0.5" width="845" height="1578" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="28" y="36" font-size="19" font-weight="700" fill="#0F172A">一次派工到放行</text><text x="184.31" y="36" font-size="13" fill="#64748B">節點交出的只是申請；放行看串接層留下的證據</text>
<line x1="28" y1="1525" x2="818" y2="1525" stroke="#E2E8F0"/>
<path d="M366,153 L366,199" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M366,265 L366,311" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M366,377 L366,423" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M366,489 L366,535" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M323,582 L323,625 Q323,633 315,633 L237,633 Q229,633 229,641 L229,659" fill="none" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><path d="M408,582 L408,771" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M408,837 L408,906.6182777215829" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M408,906.6182777215829 L408,1009" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M408,1056 L408,1109 Q408,1117 400,1117 L286,1117 Q278,1117 278,1125 L278,1137" fill="none" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><path d="M451,1056 L451,1099 Q451,1107 459,1107 L506,1107 Q514,1107 514,1115 L514,1196 Q514,1204 506,1204 L476,1204 Q468,1204 468,1212 L468,1261" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M364,1056 L364,1099 Q364,1107 356,1107 L183,1107 Q175,1107 175,1115 L175,1448.992691177795" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M503,1308 L503,1320 Q503,1328 495,1328 L248,1328 Q240,1328 240,1336 L240,1447.5239809218137" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M537,1261 L537,181 Q537,173 529,173 L459,173 Q451,173 451,165 L451,153" fill="none" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><rect x="282" y="68" width="253" height="85" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="408.5" y="97" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">派工前檢查</text><text x="408.5" y="117" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">版本同步、輸入已通過且有效、</text><text x="408.5" y="136" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">核准齊全、沒有其他執行中、環境可用</text><rect x="277" y="199" width="177" height="66" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="365.5" y="228" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">固定輸入版本，派工</text><text x="365.5" y="248" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">每次都開新的 session</text><rect x="261" y="311" width="209" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><text x="365.5" y="340" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">節點執行</text><text x="365.5" y="360" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">AI、人、工具或 script 都可以</text><rect x="261" y="423" width="209" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><text x="365.5" y="452" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">交出產出物與交接清單</text><text x="365.5" y="472" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">只是申請</text><rect x="239" y="535" width="253" height="47" rx="22" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.6" filter="url(#sh)"/><text x="365.5" y="564" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">放行前檢查：輸入有被改嗎？</text><rect x="131" y="659" width="196" height="66" rx="22" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" filter="url(#sh)"/><text x="229" y="688" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">結果保留但不放行</text><text x="229" y="708" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">依版本同步判斷重跑或重走</text><rect x="301" y="771" width="214" height="66" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="408" y="800" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">串接層執行出口檢查</text><text x="408" y="820" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">自行核對、工具執行、獨立審查</text><path d="M320,890 A87.5,7 0 0 1 495,890 V956 A87.5,7 0 0 1 320,956 Z M320,890 A87.5,7 0 0 0 495,890" fill="#EBFBEE" stroke="#51A86A" stroke-width="1.3" filter="url(#sh)"/><text x="407.5" y="919" font-size="15" font-weight="700" fill="#1E5631" text-anchor="middle">證據紀錄</text><text x="407.5" y="939" font-size="13" fill="#1E5631" text-anchor="middle" opacity="0.92">綁定目前的版本與 hash</text><rect x="321" y="1009" width="173" height="47" rx="22" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.6" filter="url(#sh)"/><text x="407.5" y="1038" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">出口檢查都通過？</text><rect x="198" y="1137" width="160" height="47" rx="22" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" filter="url(#sh)"/><text x="278" y="1166" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">交給 R 失敗分類</text><path d="M416,1261 H589 L605,1284.5 L589,1308 H416 L400,1284.5 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="502.5" y="1290" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">出口關卡：等人核准</text><path d="M109,1432 A98.5,7 0 0 1 306,1432 V1498 A98.5,7 0 0 1 109,1498 Z M109,1432 A98.5,7 0 0 0 306,1432" fill="#EBFBEE" stroke="#51A86A" stroke-width="1.3" filter="url(#sh)"/><text x="207.5" y="1461" font-size="15" font-weight="700" fill="#1E5631" text-anchor="middle">寫入正式紀錄：已通過</text><text x="207.5" y="1481" font-size="13" fill="#1E5631" text-anchor="middle" opacity="0.92">決定下一站</text><rect x="308.5" y="587.35" width="29" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="323" y="602.35" font-size="12.5" fill="#A61E4D" text-anchor="middle">有</text><rect x="387.5" y="682.9" width="41" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="408" y="697.9" font-size="12.5" fill="#1E293B" text-anchor="middle">沒有</text><rect x="387.5" y="1061.8" width="41" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="408" y="1076.8" font-size="12.5" fill="#A61E4D" text-anchor="middle">沒有</text><rect x="416.9" y="1191.5" width="116" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="474.9" y="1206.5" font-size="12.5" fill="#1E293B" text-anchor="middle">通過，這站有關卡</text><rect x="110.5" y="1248.3967110300077" width="129" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="175" y="1263.3967110300077" font-size="12.5" fill="#1E293B" text-anchor="middle">通過，這站沒有關卡</text><rect x="219.5" y="1351.357194276544" width="41" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="240" y="1366.357194276544" font-size="12.5" fill="#1E293B" text-anchor="middle">核准</text><rect x="466.5" y="1085.3" width="141" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="537" y="1100.3" font-size="12.5" fill="#A61E4D" text-anchor="middle">不核准：回本節點修正</text>
<rect x="28" y="1541" width="26" height="16" rx="4" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3"/><text x="60" y="1553.5" font-size="12.5" fill="#475569">串接層的判斷</text><rect x="157" y="1541" width="26" height="16" rx="4" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3"/><text x="189" y="1553.5" font-size="12.5" fill="#475569">節點</text><rect x="236" y="1541" width="26" height="16" rx="8" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3"/><text x="268" y="1553.5" font-size="12.5" fill="#475569">圖外的節點或起點</text><rect x="390" y="1541" width="26" height="16" rx="4" fill="#EBFBEE" stroke="#51A86A" stroke-width="1.3"/><text x="422" y="1553.5" font-size="12.5" fill="#475569">紀錄</text><path d="M475,1541 H489 L495,1549 L489,1557 H475 L469,1549 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3"/><text x="501" y="1553.5" font-size="12.5" fill="#475569">人工關卡</text><path d="M573,1549 H603" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><text x="611" y="1553.5" font-size="12.5" fill="#475569">正常往下走</text><path d="M695.5,1549 H725.5" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><text x="733.5" y="1553.5" font-size="12.5" fill="#475569">失敗或退回</text>
</svg>
