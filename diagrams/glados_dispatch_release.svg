<svg xmlns="http://www.w3.org/2000/svg" width="1064" height="1293" viewBox="0 0 1064 1293" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei','Noto Sans CJK TC',system-ui,-apple-system,'Segoe UI',sans-serif" role="img" aria-label="一次執行到完成">
<defs><marker id="a-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#64748B"/></marker><marker id="a-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#D6336C"/></marker><marker id="a-wait" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#94A3B8"/></marker><marker id="a-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#334155"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs>
<rect x="0.5" y="0.5" width="1063" height="1292" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="28" y="36" font-size="19" font-weight="700" fill="#0F172A">一次執行到完成</text><text x="184.31" y="36" font-size="13" fill="#64748B">AI 的工作一律由人開 agent 照 skill 做，串接層只開工與收件；確定性的工具步驟由串接層執行</text>
<line x1="28" y1="1239" x2="1036" y2="1239" stroke="#E2E8F0"/>
<rect x="467" y="68" width="295" height="334" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="4 4"/><text x="483" y="93" font-size="13" font-weight="700" fill="#334155">外部互動（人＋agent）</text><rect x="796" y="68" width="228" height="334" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="4 4"/><text x="812" y="93" font-size="13" font-weight="700" fill="#334155">工具步驟（串接層執行）</text><path d="M614.5,193 L614.5,213" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M614.5,298 L614.5,318" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M614.5,384 L614.8261280367262,399.0018896894087 Q615,407 615,415 L615,453" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M910,193 L910,213" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M910,298 L910,318" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M910,384 L910,419 Q910,427 902,427 L695,427 Q687,427 687,435 L687,453" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M651,519 L651,588.294528874348" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M651,588.294528874348 L651,691" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M613,738 L613,806 Q613,814 605,814 L139,814 Q131,814 131,822 L131,844" fill="none" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><path d="M638,738 L638,816 Q638,824 630,824 L390,824 Q382,824 382,832 L382,844" fill="none" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><path d="M664,738 L664,941 Q664,949 656,949 L561,949 Q553,949 553,957 L553,975" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M689,738 L689,1161.166652228794" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M553,1022 L553,1034 Q553,1042 561,1042 L625,1042 Q633,1042 633,1050 L633,1163" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><rect x="487.5" y="108" width="254" height="85" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="614.5" y="137" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">開工</text><text x="614.5" y="157" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">開執行編號、準備隔離工作區</text><text x="614.5" y="176" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">寫出工作包（skill、輪數、能否平行）</text><rect x="485" y="213" width="259" height="85" rx="10" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3" filter="url(#sh)"/><text x="614.5" y="242" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">人＋agent 照 skill 完成</text><text x="614.5" y="262" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">中間過程串接層不參與</text><text x="614.5" y="281" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">需要重做時 skill 自己重做，最多 3 輪</text><rect x="537" y="318" width="155" height="66" rx="10" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3" filter="url(#sh)"/><text x="614.5" y="347" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">人或 agent 提交</text><text x="614.5" y="367" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">提交不是核准</text><rect x="842" y="108" width="136" height="85" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="910" y="137" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">執行前</text><text x="910" y="157" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">固定輸入 commit</text><text x="910" y="176" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">人觸發或自動接續</text><rect x="814" y="213" width="192" height="85" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><text x="910" y="242" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">工具執行</text><text x="910" y="262" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">機械替換、build、上機測試</text><text x="910" y="281" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">不用 AI</text><rect x="829" y="318" width="162" height="66" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="910" y="347" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">回收</text><text x="910" y="367" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">核對只寫在允許範圍內</text><rect x="544" y="453" width="214" height="66" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="651" y="482" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">收件檢查與擋關檢查</text><text x="651" y="502" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">自動核對、工具執行、獨立審查</text><path d="M587,572 A64,7 0 0 1 715,572 V638 A64,7 0 0 1 587,638 Z M587,572 A64,7 0 0 0 715,572" fill="#EBFBEE" stroke="#51A86A" stroke-width="1.3" filter="url(#sh)"/><text x="651" y="601" font-size="15" font-weight="700" fill="#1E5631" text-anchor="middle">證據紀錄</text><text x="651" y="621" font-size="13" fill="#1E5631" text-anchor="middle" opacity="0.92">綁定 commit</text><rect x="587" y="691" width="128" height="47" rx="22" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.6" filter="url(#sh)"/><text x="651" y="720" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">都通過？</text><rect x="40" y="844" width="181" height="66" rx="10" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3" filter="url(#sh)"/><text x="130.5" y="873" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">外部互動：交還補齊</text><text x="130.5" y="893" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">回到進行中</text><rect x="255" y="844" width="253" height="85" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="381.5" y="873" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">工具步驟沒過</text><text x="381.5" y="893" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">回產生內容的外部互動步驟，計入輪數</text><text x="381.5" y="912" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">環境、設備問題交給人</text><path d="M466,975 H639 L655,998.5 L639,1022 H466 L450,998.5 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="552.5" y="1004" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">出口關卡：等人核准</text><path d="M578,1146 A83,7 0 0 1 744,1146 V1212 A83,7 0 0 1 578,1212 Z M578,1146 A83,7 0 0 0 744,1146" fill="#EBFBEE" stroke="#51A86A" stroke-width="1.3" filter="url(#sh)"/><text x="661" y="1175" font-size="15" font-weight="700" fill="#1E5631" text-anchor="middle">完成</text><text x="661" y="1195" font-size="13" fill="#1E5631" text-anchor="middle" opacity="0.92">記錄進度，判斷下一站</text><rect x="555" y="744.5" width="116" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="613" y="759.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">沒有（外部互動）</text><rect x="580" y="777.1" width="116" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="638" y="792.1" font-size="12.5" fill="#A61E4D" text-anchor="middle">沒有（工具步驟）</text><rect x="539.4" y="936.5" width="116" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="597.4" y="951.5" font-size="12.5" fill="#1E293B" text-anchor="middle">通過，這站有關卡</text><rect x="624.5" y="1042.8749891715956" width="129" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="689" y="1057.8749891715956" font-size="12.5" fill="#1E293B" text-anchor="middle">通過，這站沒有關卡</text><rect x="612.5" y="1077.9" width="41" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="633" y="1092.9" font-size="12.5" fill="#1E293B" text-anchor="middle">核准</text>
<rect x="28" y="1255" width="26" height="16" rx="4" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3"/><text x="60" y="1267.5" font-size="12.5" fill="#475569">串接層的判斷</text><rect x="157" y="1255" width="26" height="16" rx="4" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3"/><text x="189" y="1267.5" font-size="12.5" fill="#475569">需要人</text><rect x="248.5" y="1255" width="26" height="16" rx="4" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3"/><text x="280.5" y="1267.5" font-size="12.5" fill="#475569">節點</text><rect x="327.5" y="1255" width="26" height="16" rx="4" fill="#EBFBEE" stroke="#51A86A" stroke-width="1.3"/><text x="359.5" y="1267.5" font-size="12.5" fill="#475569">紀錄</text><path d="M412.5,1255 H426.5 L432.5,1263 L426.5,1271 H412.5 L406.5,1263 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3"/><text x="438.5" y="1267.5" font-size="12.5" fill="#475569">人工關卡</text><path d="M510.5,1263 H540.5" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><text x="548.5" y="1267.5" font-size="12.5" fill="#475569">正常往下走</text><path d="M633,1263 H663" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><text x="671" y="1267.5" font-size="12.5" fill="#475569">失敗或退回</text>
</svg>
