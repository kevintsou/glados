6" marker-end="url(#a-normal)"/><path d="M610,984 L610,996 Q610,1004 618,1004 L682,1004 Q690,1004 690,1012 L690,1125" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><rect x="460" y="127" width="201" height="85" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="560.5" y="156" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">開工</text><text x="560.5" y="176" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">開執行編號、準備隔離工作區</text><text x="560.5" y="195" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">寫出工作包</text><rect x="477.5" y="232" width="166" height="66" rx="10" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3" filter="url(#sh)"/><text x="560.5" y="261" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">人＋agent 完成</text><text x="560.5" y="281" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">中間過程串接層不參與</text><rect x="496.5" y="318" width="128" height="47" rx="10" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3" filter="url(#sh)"/><text x="560.5" y="347" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">人提交</text><rect x="731" y="108" width="220" height="85" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="841" y="137" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">派工</text><text x="841" y="157" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">固定輸入 commit</text><text x="841" y="176" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">每次開新的 session 或工具執行</text><rect x="766.5" y="213" width="149" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><text x="841" y="242" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">AI 或工具執行</text><text x="841" y="262" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">交出產出與交接說明</text><rect x="760" y="299" width="162" height="66" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="841" y="328" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">回收</text><text x="841" y="348" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">核對只寫在允許範圍內</text><rect x="490" y="434" width="214" height="66" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="597" y="463" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">收件檢查與擋關檢查</text><text x="597" y="483" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">自動核對、工具執行、獨立審查</text><path d="M533,553 A64,7 0 0 1 661,553 V619 A64,7 0 0 1 533,619 Z M533,553 A64,7 0 0 0 661,553" fill="#EBFBEE" stroke="#51A86A" stroke-width="1.3" filter="url(#sh)"/><text x="597" y="582" font-size="15" font-weight="700" fill="#1E5631" text-anchor="middle">證據紀錄</text><text x="597" y="602" font-size="13" fill="#1E5631" text-anchor="middle" opacity="0.92">綁定 commit</text><rect x="533" y="672" width="128" height="47" rx="22" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.6" filter="url(#sh)"/><text x="597" y="701" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">都通過？</text><rect x="40" y="825" width="213" height="47" rx="10" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3" filter="url(#sh)"/><text x="146.5" y="854" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">外部互動：交還給人補齊</text><rect x="287" y="825" width="167" height="66" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="370.5" y="854" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">派工：節點內重做</text><text x="370.5" y="874" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">最多 3 輪，超過交給人</text><path d="M523,937 H696 L712,960.5 L696,984 H523 L507,960.5 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="609.5" y="966" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">出口關卡：等人核准</text><path d="M635,1108 A83,7 0 0 1 801,1108 V1174 A83,7 0 0 1 635,1174 Z M635,1108 A83,7 0 0 0 801,1108" fill="#EBFBEE" stroke="#51A86A" stroke-width="1.3" filter="url(#sh)"/><text x="718" y="1137" font-size="15" font-weight="700" fill="#1E5631" text-anchor="middle">完成</text><text x="718" y="1157" font-size="13" fill="#1E5631" text-anchor="middle" opacity="0.92">記錄進度，判斷下一站</text><rect x="501" y="725.5" width="116" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="559" y="740.5" font-size="12.5" fill="#A61E4D" text-anchor="middle">沒有（外部互動）</text><rect x="538.5" y="758.1" width="91" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="584" y="773.1" font-size="12.5" fill="#A61E4D" text-anchor="middle">沒有（派工）</text><rect x="552" y="848.2" width="116" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="610" y="863.2" font-size="12.5" fill="#1E293B" text-anchor="middle">通過，這站有關卡</text><rect x="681.5" y="995.8083239487161" width="129" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="746" y="1010.8083239487161" font-size="12.5" fill="#1E293B" text-anchor="middle">通過，這站沒有關卡</text><rect x="669.5" y="1027.8" width="41" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="690" y="1042.8" font-size="12.5" fill="#1E293B" text-anchor="middle">核准</text>
