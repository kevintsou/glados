<svg xmlns="http://www.w3.org/2000/svg" width="846" height="1710" viewBox="0 0 846 1710" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei','Noto Sans CJK TC',system-ui,-apple-system,'Segoe UI',sans-serif" role="img" aria-label="一次派工到放行">
<defs><marker id="a-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#64748B"/></marker><marker id="a-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#D6336C"/></marker><marker id="a-wait" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#94A3B8"/></marker><marker id="a-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#334155"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs>
<rect x="0.5" y="0.5" width="845" height="1709" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="28" y="36" font-size="19" font-weight="700" fill="#0F172A">一次派工到放行</text><text x="184.31" y="36" font-size="13" fill="#64748B">節點交出的只是申請；放行看串接層留下的證據</text>
<line x1="28" y1="1656" x2="818" y2="1656" stroke="#E2E8F0"/>
<path d="M275,172 L275,218" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M275,284 L275,330" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M275,396 L275,442" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M275,508 L275,554" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M232,601 L232,644 Q232,652 224,652 L146,652 Q138,652 138,660 L138,678" fill="none" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><path d="M317,601 L317,790" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M317,856 L317,925.6182777215829" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M317,925.6182777215829 L317,1028" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M273,1075 L273,1118 Q273,1126 265,1126 L180,1126 Q172,1126 172,1134 L172,1156" fill="none" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><path d="M360,1075 L360,1118 Q360,1126 368,1126 L411,1126 Q419,1126 419,1134 L419,1215 Q419,1223 411,1223 L385,1223 Q377,1223 377,1231 L377,1280" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M317,1075 L317,1128 Q317,1136 309,1136 L282,1136 Q274,1136 274,1144 L274,1444" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M412,1327 L412,1339 Q412,1347 404,1347 L363,1347 Q355,1347 355,1355 L355,1444" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M315,1510 L315,1579.7005845250162" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M446,1280 L446,200 Q446,192 438,192 L355,192 Q347,192 347,184 L347,172" fill="none" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><rect x="204" y="68" width="214" height="104" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="311" y="97" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">派工前檢查</text><text x="311" y="117" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">版本同步、輸入已通過且有效、</text><text x="311" y="136" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">核准齊全、沒有其他執行中、</text><text x="311" y="155" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">環境可用且符合環境清單</text><rect x="186" y="218" width="177" height="66" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="274.5" y="247" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">固定輸入版本，派工</text><text x="274.5" y="267" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">每次都開新的 session</text><rect x="170" y="330" width="209" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><text x="274.5" y="359" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">節點執行</text><text x="274.5" y="379" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">AI、人、工具或 script 都可以</text><rect x="170" y="442" width="209" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><text x="274.5" y="471" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">交出產出物與交接清單</text><text x="274.5" y="491" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">只是申請</text><rect x="148" y="554" width="253" height="47" rx="22" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.6" filter="url(#sh)"/><text x="274.5" y="583" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">放行前檢查：輸入有被改嗎？</text><rect x="40" y="678" width="196" height="66" rx="22" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" filter="url(#sh)"/><text x="138" y="707" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">結果保留但不放行</text><text x="138" y="727" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">依版本同步判斷重跑或重走</text><rect x="210" y="790" width="214" height="66" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="317" y="819" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">串接層執行出口檢查</text><text x="317" y="839" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">自行核對、工具執行、獨立審查</text><path d="M229,909 A87.5,7 0 0 1 404,909 V975 A87.5,7 0 0 1 229,975 Z M229,909 A87.5,7 0 0 0 404,909" fill="#EBFBEE" stroke="#51A86A" stroke-width="1.3" filter="url(#sh)"/><text x="316.5" y="938" font-size="15" font-weight="700" fill="#1E5631" text-anchor="middle">證據紀錄</text><text x="316.5" y="958" font-size="13" fill="#1E5631" text-anchor="middle" opacity="0.92">綁定目前的版本與 hash</text><rect x="230" y="1028" width="173" height="47" rx="22" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.6" filter="url(#sh)"/><text x="316.5" y="1057" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">出口檢查都通過？</text><rect x="92" y="1156" width="160" height="47" rx="22" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" filter="url(#sh)"/><text x="172" y="1185" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">交給 R 失敗分類</text><path d="M325,1280 H498 L514,1303.5 L498,1327 H325 L309,1303.5 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.8" filter="url(#sh)"/><text x="411.5" y="1309" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">出口關卡：等人核准</text><rect x="194" y="1444" width="241" height="66" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="314.5" y="1473" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">核對必要核准，完成服務產出</text><text x="314.5" y="1493" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">例如 M2 的測試基準</text><path d="M216,1563 A98.5,7 0 0 1 413,1563 V1629 A98.5,7 0 0 1 216,1629 Z M216,1563 A98.5,7 0 0 0 413,1563" fill="#EBFBEE" stroke="#51A86A" stroke-width="1.3" filter="url(#sh)"/><text x="314.5" y="1592" font-size="15" font-weight="700" fill="#1E5631" text-anchor="middle">寫入正式紀錄：已通過</text><text x="314.5" y="1612" font-size="13" fill="#1E5631" text-anchor="middle" opacity="0.92">決定下一站</text><rect x="217.5" y="606.35" width="29" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="232" y="621.35" font-size="12.5" fill="#A61E4D" text-anchor="middle">有</text><rect x="296.5" y="701.9" width="41" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="317" y="716.9" font-size="12.5" fill="#1E293B" text-anchor="middle">沒有</text><rect x="252.5" y="1080.35" width="41" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="273" y="1095.35" font-size="12.5" fill="#A61E4D" text-anchor="middle">沒有</text><rect x="325.3" y="1210.5" width="116" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="383.3" y="1225.5" font-size="12.5" fill="#1E293B" text-anchor="middle">通過，這站有關卡</text><rect x="209.5" y="1246.7" width="129" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="274" y="1261.7" font-size="12.5" fill="#1E293B" text-anchor="middle">通過，這站沒有關卡</text><rect x="334.5" y="1373.3" width="41" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="355" y="1388.3" font-size="12.5" fill="#1E293B" text-anchor="middle">核准</text><rect x="375.5" y="1104.3" width="141" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="446" y="1119.3" font-size="12.5" fill="#A61E4D" text-anchor="middle">不核准：回本節點修正</text>
<rect x="28" y="1672" width="26" height="16" rx="4" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3"/><text x="60" y="1684.5" font-size="12.5" fill="#475569">串接層的判斷</text><rect x="157" y="1672" width="26" height="16" rx="4" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3"/><text x="189" y="1684.5" font-size="12.5" fill="#475569">節點</text><rect x="236" y="1672" width="26" height="16" rx="8" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3"/><text x="268" y="1684.5" font-size="12.5" fill="#475569">圖外的節點或起點</text><rect x="390" y="1672" width="26" height="16" rx="4" fill="#EBFBEE" stroke="#51A86A" stroke-width="1.3"/><text x="422" y="1684.5" font-size="12.5" fill="#475569">紀錄</text><path d="M475,1672 H489 L495,1680 L489,1688 H475 L469,1680 Z" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3"/><text x="501" y="1684.5" font-size="12.5" fill="#475569">人工關卡</text><path d="M573,1680 H603" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><text x="611" y="1684.5" font-size="12.5" fill="#475569">正常往下走</text><path d="M695.5,1680 H725.5" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><text x="733.5" y="1684.5" font-size="12.5" fill="#475569">失敗或退回</text>
</svg>
