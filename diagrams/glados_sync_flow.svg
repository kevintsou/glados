 y="97" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">什麼時候執行</text><text x="772.5" y="117" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">開啟專案、新 commit、派工前、放行前</text><rect x="669" y="180" width="207" height="66" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="772.5" y="209" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">固定這次讀到的 commit</text><text x="772.5" y="229" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">和上次檢查過的版本比對</text><rect x="651" y="292" width="173" height="47" rx="22" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.6" filter="url(#sh)"/><text x="737.5" y="321" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">這次有什麼變更？</text><rect x="40" y="424" width="136" height="85" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="108" y="453" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">只有進度紀錄</text><text x="108" y="473" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">更新已檢查的位置</text><text x="108" y="492" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">證據保持有效</text><rect x="210" y="424" width="186" height="85" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="303" y="453" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">有人手動改 FW code</text><text x="303" y="473" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">登記人工 diff、重新 build</text><text x="303" y="492" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">舊證據過期，從 M5 重走</text><rect x="430" y="430" width="197" height="85" rx="10" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3" filter="url(#sh)"/><text x="528.5" y="459" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">需求、介面或設定改了</text><text x="528.5" y="479" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">交給 C 變更分析與關卡</text><text x="528.5" y="498" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">已在 repo 裡不等於已核准</text><rect x="661" y="424" width="177" height="85" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="749.5" y="453" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">測試或驗證環境改了</text><text x="749.5" y="473" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">相關證據過期</text><text x="749.5" y="492" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">回 M2，或處理環境</text><rect x="872" y="424" width="162" height="85" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="953" y="453" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">執行期間輸入被改</text><text x="953" y="473" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">結果保留但不放行</text><text x="953" y="492" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">判斷重跑或從哪裡重走</text><rect x="1068" y="430" width="217" height="104" rx="10" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3" filter="url(#sh)"/><text x="1176.5" y="459" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">分岔、衝突或影響不明</text><text x="1176.5" y="479" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">含未提交的修改</text><text x="1176.5" y="498" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">擋住交給人</text><text x="1176.5" y="517" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">不自動 reset、merge、rebase</text><rect x="233" y="584" width="175" height="66" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="320.5" y="613" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">派工或放行前</text><text x="320.5" y="633" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">再確認一次 branch 沒變</text><rect x="1180" y="392.9" width="66" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="1213" y="407.9" font-size="12.5" fill="#A61E4D" text-anchor="middle">人處理完</text>
