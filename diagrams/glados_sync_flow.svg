<svg xmlns="http://www.w3.org/2000/svg" width="1369" height="672" viewBox="0 0 1369 672" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei','Noto Sans CJK TC',system-ui,-apple-system,'Segoe UI',sans-serif" role="img" aria-label="新 commit 的處理">
<defs><marker id="a-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#64748B"/></marker><marker id="a-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#D6336C"/></marker><marker id="a-wait" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#94A3B8"/></marker><marker id="a-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#334155"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs>
<rect x="0.5" y="0.5" width="1368" height="671" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="28" y="36" font-size="19" font-weight="700" fill="#0F172A">新 commit 的處理</text><text x="210.33240000000004" y="36" font-size="13" fill="#64748B">串接層列出影響、交給人決定；不自動分流、不自動合併</text>
<line x1="28" y1="618" x2="1341" y2="618" stroke="#E2E8F0"/>
<path d="M751,134 L751,180" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M713,246 L713,292" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M670,339 L670,351 Q670,359 662,359 L167,359 Q159,359 159,367 L159,420" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M692,339 L692,361 Q692,369 684,369 L426,369 Q418,369 418,377 L418,404.5" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M713,339 L713,420" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M734,339 L734,361 Q734,369 742,369 L976,369 Q984,369 984,377 L984,404.5" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M756,339 L756,351 Q756,359 764,359 L1168,359 Q1176,359 1176,367 L1176,420" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M418,489.5 L418,551" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M984,489.5 L984,517 Q984,525 976,525 L507,525 Q499,525 499,533 L499,551" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><path d="M1253,420 L1253,274 Q1253,266 1245,266 L797,266 Q789,266 789,258 L789,246" fill="none" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><rect x="614" y="68" width="273" height="66" rx="22" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3" filter="url(#sh)"/><text x="750.5" y="97" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">什麼時候檢查</text><text x="750.5" y="117" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">開啟專案、新 commit、派工前、收件時</text><rect x="636" y="180" width="230" height="66" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="751" y="209" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">列出新 commit 碰到的檔案</text><text x="751" y="229" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">被哪些節點讀過或產出</text><rect x="649" y="292" width="128" height="47" rx="22" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.6" filter="url(#sh)"/><text x="713" y="321" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">是哪一種？</text><rect x="40" y="420" width="237" height="66" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="158.5" y="449" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">只改 .glados/ 的進度與紀錄</text><text x="158.5" y="469" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">不影響 build 與測試結果</text><rect x="311" y="404.5" width="213" height="85" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="417.5" y="433.5" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">人工改了 FW code</text><text x="417.5" y="453.5" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">可以，接回流程</text><text x="417.5" y="472.5" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">該模組重新 build、跑 M5、M6</text><rect x="558" y="420" width="309" height="85" rx="10" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3" filter="url(#sh)"/><text x="712.5" y="449" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">改了已核准的需求、介面、預算或設定</text><text x="712.5" y="469" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">G1 前：回 P0／P2 討論</text><text x="712.5" y="488" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">之後：C＋GC</text><rect x="901" y="404.5" width="165" height="85" rx="10" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3" filter="url(#sh)"/><text x="983.5" y="433.5" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">執行期間輸入被改</text><text x="983.5" y="453.5" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">結果保留並標示</text><text x="983.5" y="472.5" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">人決定沿用或重跑</text><rect x="1100" y="420" width="229" height="85" rx="10" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3" filter="url(#sh)"/><text x="1214.5" y="449" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">分岔、衝突、未提交的修改</text><text x="1214.5" y="469" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">交給人</text><text x="1214.5" y="488" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">不自動 reset、merge、rebase</text><rect x="336" y="551" width="245" height="47" rx="10" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3" filter="url(#sh)"/><text x="458.5" y="580" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">提示人：這些節點要不要重做</text><rect x="1220" y="384.4" width="66" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="1253" y="399.4" font-size="12.5" fill="#A61E4D" text-anchor="middle">人處理完</text>
<rect x="28" y="634" width="26" height="16" rx="8" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3"/><text x="60" y="646.5" font-size="12.5" fill="#475569">圖外的節點或起點</text><rect x="182" y="634" width="26" height="16" rx="4" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3"/><text x="214" y="646.5" font-size="12.5" fill="#475569">串接層的判斷</text><rect x="311" y="634" width="26" height="16" rx="4" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3"/><text x="343" y="646.5" font-size="12.5" fill="#475569">需要人</text><path d="M402.5,642 H432.5" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><text x="440.5" y="646.5" font-size="12.5" fill="#475569">正常往下走</text><path d="M525,642 H555" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><text x="563" y="646.5" font-size="12.5" fill="#475569">失敗或退回</text>
</svg>
