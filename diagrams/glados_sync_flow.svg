="865.5" y="97" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">什麼時候執行</text><text x="865.5" y="117" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">開啟專案、新 commit、派工前、放行前</text><rect x="762" y="180" width="207" height="66" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="865.5" y="209" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">固定這次讀到的 commit</text><text x="865.5" y="229" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">和上次檢查過的版本比對</text><rect x="744" y="292" width="173" height="47" rx="22" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.6" filter="url(#sh)"/><text x="830.5" y="321" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">這次有什麼變更？</text><rect x="40" y="424" width="136" height="85" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="108" y="453" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">只有進度紀錄</text><text x="108" y="473" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">更新已檢查的位置</text><text x="108" y="492" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">證據保持有效</text><rect x="210" y="424" width="246" height="85" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="333" y="453" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">有人手動改 FW code</text><text x="333" y="473" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">登記人工 diff、重新 build</text><text x="333" y="492" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">必要時更新 M3 計畫，再走 M5、M6</text><rect x="490" y="430" width="230" height="104" rx="10" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3" filter="url(#sh)"/><text x="605" y="459" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">需求、介面或設定改了</text><text x="605" y="479" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">第一次通過 G1 前：P0／P2 整理</text><text x="605" y="498" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">之後：C 變更分析與關卡</text><text x="605" y="517" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">已在 repo 裡不等於已核准</text><rect x="754" y="424" width="177" height="85" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="842.5" y="453" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">測試或驗證環境改了</text><text x="842.5" y="473" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">相關證據過期</text><text x="842.5" y="492" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">回 M2，或處理環境</text><rect x="965" y="424" width="162" height="85" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="1046" y="453" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">執行期間輸入被改</text><text x="1046" y="473" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">結果保留但不放行</text><text x="1046" y="492" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">判斷重跑或從哪裡重走</text><rect x="1161" y="430" width="217" height="104" rx="10" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3" filter="url(#sh)"/><text x="1269.5" y="459" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">分岔、衝突或影響不明</text><text x="1269.5" y="479" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">含未提交的修改</text><text x="1269.5" y="498" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">擋住交給人</text><text x="1269.5" y="517" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">不自動 reset、merge、rebase</text><rect x="263" y="584" width="175" height="66" rx="10" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3" filter="url(#sh)"/><text x="350.5" y="613" font-size="15" font-weight="700" fill="#43307A" text-anchor="middle">派工或放行前</text><text x="350.5" y="633" font-size="13" fill="#43307A" text-anchor="middle" opacity="0.92">再確認一次 branch 沒變</text><rect x="1273" y="392.9" width="66" height="25" rx="6" fill="#FFFFFF" stroke="#F3B4C8"/><text x="1306" y="407.9" font-size="12.5" fill="#A61E4D" text-anchor="middle">人處理完</text>
<rect x="28" y="686" width="26" height="16" rx="8" fill="#F8FAFC" stroke="#AAB4C3" stroke-width="1.3"/><text x="60" y="698.5" font-size="12.5" fill="#475569">圖外的節點或起點</text><rect x="182" y="686" width="26" height="16" rx="4" fill="#F3F0FF" stroke="#9A84D8" stroke-width="1.3"/><text x="214" y="698.5" font-size="12.5" fill="#475569">串接層的判斷</text><rect x="311" y="686" width="26" height="16" rx="4" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3"/><text x="343" y="698.5" font-size="12.5" fill="#475569">需要人</text><path d="M402.5,694 H432.5" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-normal)"/><text x="440.5" y="698.5" font-size="12.5" fill="#475569">正常往下走</text><path d="M525,694 H555" stroke="#D6336C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-back)"/><text x="563" y="698.5" font-size="12.5" fill="#475569">失敗或退回</text>
</svg>
