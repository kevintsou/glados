t-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">服務在背景執行</text><text x="381.5" y="713" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">派工仍依專案規則與關卡</text><rect x="118" y="847" width="129" height="47" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><text x="182.5" y="876" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">服務繼續執行</text><rect x="281" y="847" width="201" height="85" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><text x="381.5" y="876" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">一般停止</text><text x="381.5" y="896" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">停止新派工、顯示「停止中」</text><text x="381.5" y="915" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">等目前的執行回收並保存</text><rect x="516" y="847" width="186" height="85" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><text x="609" y="876" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">立即停止</text><text x="609" y="896" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">要求取消</text><text x="609" y="915" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">保存產出、log 與中斷狀態</text><rect x="550" y="978" width="205" height="66" rx="10" fill="#FFF4E6" stroke="#E8933B" stroke-width="1.3" filter="url(#sh)"/><text x="652.5" y="1007" font-size="15" font-weight="700" fill="#8A4B0F" text-anchor="middle">標示「待核對」</text><text x="652.5" y="1027" font-size="13" fill="#8A4B0F" text-anchor="middle" opacity="0.92">沒能確認停止的執行端或設備</text><rect x="315" y="978" width="201" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><text x="415.5" y="1007" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">服務退出</text><text x="415.5" y="1027" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">已開啟的分頁不會自動重啟它</text><rect x="333" y="35