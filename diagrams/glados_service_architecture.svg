" text-anchor="middle" opacity="0.92">通過紀錄、核准索引、正式進度、</text><text x="766.5" y="593" font-size="13" fill="#1E5631" text-anchor="middle" opacity="0.92">執行紀錄、版本同步報告</text><rect x="289" y="525" width="187" height="85" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><text x="382.5" y="554" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">執行工作區</text><text x="382.5" y="574" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">按需 clone，固定輸入版本</text><text x="382.5" y="593" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">遵守隔離</text><rect x="383" y="663" width="190" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><text x="478" y="692" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">節點執行</text><text x="478" y="712" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">AI session、build、script</text><rect x="466" y="846" width="193" height="85" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><text x="562.5" y="875" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">模組工作 branch</text><text x="562.5" y="895" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">.glados/ 產出物與交接清單</text><text x="562.5" y="914" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">（申請）</text><rect x="110" y="518" width="145" height="66" rx="10" fill="#EEF4FF" stroke="#6B8DD6" stroke-width="1.3" filter="url(#sh)"/><text x="182.5" y="547" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">openBCT</text><text x="182.5" y="567" font-size="13" fill="#475569" text-anchor="middle" opacity="0.92">跑 case、借還設備</text><rect x="602.1" y="265" width="79" height="42" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="641.6" y="280" font-size="12.5" fill="#1E293B" text-anchor="middle">開啟時連線</text><text x="641.6" y="297" font-size="12.5" fill="#1E293B" text-anchor="middle">必要時啟動</text><rect x="343" y="228.85" width="104" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="395" y="243.85" font-size="12.5" fill="#1E293B" text-anchor="middle">單獨啟動或停止</text><rect x="154" y="225.45" width="104" height="42" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="206" y="240.45" font-size="12.5" fill="#1E293B" text-anchor="middle">核對身分與版本</text><text x="206" y="257.45" font-size="12.5" fill="#1E293B" text-anchor="middle">後建立索引</text><rect x="614.75" y="404.5" width="104" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="666.75" y="419.5" font-size="12.5" fill="#1E293B" text-anchor="middle">只有服務能寫入</text><rect x="395.5" y="446.25" width="41" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="416" y="461.25" font-size="12.5" fill="#1E293B" text-anchor="middle">派工</text><rect x="433.8" y="736.5" width="104" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="485.8" y="751.5" font-size="12.5" fill="#1E293B" text-anchor="middle">產出與交接清單</text><rect x="555.5" y="561.15" width="79" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="595" y="576.15" font-size="12.5" fill="#1E293B" text-anchor="middle">回收、核對</text><rect x="102" y="444.9" width="112" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="158" y="459.9" font-size="12.5" fill="#1E293B" text-anchor="middle">跑 case、借設備</text><rect x="215.25" y="414.5" width="141" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="285.75" y="429.5" font-size="12.5" fill="#1E293B" text-anchor="middle">報告（核對後才採用）</text><rect x="747" y="348.27550444388976" width="116" height="25" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="805" y="363.27550444388976" font-size="12.5" fill="#1E293B" text-anchor="middle">只看進度時直接讀</text>
